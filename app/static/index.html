<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
let current = null;

async function api(path, opts = {}) {
  let res;
  try { res = await fetch(path, {headers: {"Content-Type": "application/json"}, ...opts}); }
  catch { throw new Error("Can't reach the Healer Review server - check your connection, or the site may be restarting (network error)."); }
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(body.detail || `Request failed (${res.status})`), {ref: body.ref || res.headers.get("X-Request-Id")});
  return body;
}

async function loadBudget() {
  try {
    const b = await api("/api/budget");
    $("budget").textContent = `WCL API ${b.used}/${b.limit} this hour · resets in ${Math.ceil(b.reset_in_s / 60)} min`;
  } catch { $("budget").textContent = ""; }
}

async function loadSettings() {
  const s = await api("/api/settings");
  if (s.name) {
    $("charBtn").textContent = `${s.name} · ${s.server} ${s.region.toUpperCase()}`;
    $("cName").value = s.name; $("cServer").value = s.server; $("cRegion").value = s.region;
    const known = [...((MINE || {}).characters || []), ...recentChars()].find((c) => charKey(c) === charKey(s));
    CURRENT_CHAR = {...s, class: s.class || (known && known.class)};
  }
  return s;
}

function ago(iso) {
  const mins = Math.round((Date.now() - new Date(iso)) / 60000);
  if (mins < 60) return `${mins}m ago`;
  if (mins < 1440) return `${Math.round(mins / 60)}h ago`;
  return new Date(iso).toLocaleDateString();
}

// Keys played less than an hour apart (end of one to start of the next) are one play session, across reports.
const SESSION_GAP_MS = 3600 * 1000;
function playSessions(runs) {
  const sorted = [...runs].sort((a, b) => new Date(b.started) - new Date(a.started)), out = [];
  for (const r of sorted) {
    const start = new Date(r.started).getTime(), end = start + r.duration_min * 60000, s = out[out.length - 1];
    if (s && s.start - end < SESSION_GAP_MS) { s.runs.push(r); s.start = start; }
    else out.push({runs: [r], start, end});
  }
  const hm = (t) => new Date(t).toLocaleTimeString([], {hour: "numeric", minute: "2-digit"});
  return out.map((s) => {
    const day = new Date(s.start).toLocaleDateString([], {weekday: "short", day: "numeric", month: "short"});
    const timed = s.runs.filter((r) => r.timed).length, n = s.runs.length;
    return {...s, id: new Date(s.start).toISOString(),
            label: `${day}, ${hm(s.start)}–${hm(s.end)} · ${n} key${n > 1 ? "s" : ""} · ${timed} timed`};
  });
}
function sessionState() {
  try { return JSON.parse(localStorage.getItem("keySessions") || "{}"); } catch (e) { return {}; }
}

let RUNS_LIMIT = 5;  // reports checked; "Load more" raises it
// Refresh button: re-checks Warcraft Logs right away (skips the server's 5-minute cache of new reports).
async function refreshRuns() {
  const b = $("runsRefresh");
  if (b.disabled) return;
  b.disabled = true; b.classList.add("spin");
  try { await loadRuns(RUNS_LIMIT, true); } finally { b.disabled = false; b.classList.remove("spin"); }
}
async function loadRuns(limit = RUNS_LIMIT, fresh = false) {
  RUNS_LIMIT = limit;
  const s = await loadSettings().catch(() => ({}));
  if (!s.name) {
    $("runs").innerHTML = `<div class="empty">Set your character to see recent keys.<br><br><button class="primary" onclick="openChar()">Set character</button></div>`;
    return;
  }
  const retry = `<button class="pill" onclick="loadRuns()">Try again</button>`;
  try {
    const data = await api(`/api/recent?limit=${limit}${fresh ? "&fresh=true" : ""}`);
    // A WCL rate limit part-way: show what was found plus the reason, with "Try again".
    if (data.partial) reportError("keys", "Loading all your recent keys", data.partial, () => loadRuns()); else clearError("keys");
    const note = data.partial ? `<div class="empty">Some keys couldn't be loaded yet.<br><br>${retry}</div>` : "";
    const quiet = data.note ? `<div class="updnote">${esc(data.note)}</div>` : "";
    if (data.note) { clearError("keys"); clearTimeout(window.runsRetry); window.runsRetry = setTimeout(() => loadRuns(), 120000); }
    const more = data.more && !data.partial ? `<button class="pill" onclick="loadRuns(12)">Load more</button>` : "";
    if (!data.runs.length) { $("runs").innerHTML = note || `<div class="empty">No recent M+ runs found.${more ? `<br><br>${more}` : ""}</div>`; return; }
    const row = (r) => `
      <button class="run${current === r.url ? " active" : ""}" data-url="${esc(r.url)}" ${r.analyzable ? "" :
        `disabled title="You played ${esc(r.spec || "another character")} - only supported healer specs can be analyzed"`}>
        <span class="lvl">+${r.level}</span>
        <span class="nm" title="${esc(r.dungeon)} +${r.level}">${esc(r.dungeon)}</span>
        <span class="tag res ${r.timed ? "timed" : "depleted"}" ${!r.timed && r.duration_min < 20 ? 'title="Left before the end - a completed key runs longer"' : ""}>${r.timed ? "Timed" : r.duration_min < 20 ? "Abandoned" : "Not timed"}</span>
        <span class="sub"><span>${ago(r.started)}</span><span>${r.duration_min} min</span>
          ${r.analyzable ? "" : `<span>${esc(r.spec || "not in group")}</span>`}</span>
        <span class="st">${r.analyzed ? `<span class="tag done">Analyzed</span>` : r.queued
          ? `<span class="tag prep" title="Being analyzed in the background - ready soon">Preparing...</span>` : ""}</span>
      </button>`;
    const sessions = playSessions(data.runs), open = sessionState();
    $("runs").innerHTML = quiet + sessions.map((s, i) => `
      <details class="ksess" data-id="${esc(s.id)}" ${(open[s.id] ?? i === 0) ? "open" : ""}>
        <summary>${esc(s.label)}</summary>
        <div class="runs">${s.runs.map(row).join("")}</div>
      </details>`).join("") + note + (more ? `<div class="empty">${more}</div>` : "");
    document.querySelectorAll(".run:not([disabled])").forEach((el) => el.onclick = () => analyze(el.dataset.url));
    document.querySelectorAll(".ksess").forEach((el) => el.ontoggle = () => {
      const st = sessionState(); st[el.dataset.id] = el.open;
      try { localStorage.setItem("keySessions", JSON.stringify(st)); } catch (e) {}
    });
    // Keys being prepared in the background: refresh the list until they're done.
    clearTimeout(window.prepPoll);
    if (data.runs.some((r) => r.queued)) window.prepPoll = setTimeout(() => loadRuns(), 20000);
  } catch (e) {
    reportError("keys", "Loading your recent keys", e.message, () => loadRuns(), e.ref);
    $("runs").innerHTML = `<div class="empty">Couldn't load your recent keys.<br><br>${retry}</div>`;
  }
}

function sevClass(s) { return s >= 70 ? "high" : s >= 45 ? "med" : "low"; }
function sevLabel(s) { return s >= 70 ? "High" : s >= 45 ? "Medium" : "Low"; }

async function analyze(url, fresh = false) {
  current = url;
  document.querySelectorAll(".run").forEach((el) => el.classList.toggle("active", el.dataset.url === url));
  $("main").innerHTML = `<div class="card"><h2>Analyzing</h2><div class="progress" id="progress"><div>Starting...</div></div></div>`;
  try {
    const r = await api("/api/analyze", {method: "POST", body: JSON.stringify({url, fresh})});
    if (r.result && !r.job) { clearError("analysis"); render(r.result, url); return; }  // stored, current rules: instant
    // A stored analysis from older rules shows at once while the new one is made in the background.
    if (r.result) { render(r.result, url); setUpdateNote("Updating to the latest rules..."); }
    let previewed = 0;  // preview stage shown (1 = timeline, 2 = + deaths and DPS windows)
    while (true) {
      await new Promise((res) => setTimeout(res, 1500));
      if (current !== url) return;
      const j = await api(`/api/jobs/${r.job}${previewed >= 2 || r.result ? "?skip_preview=true" : ""}`);
      const stage = j.preview ? j.preview.stage || 1 : 0;
      if (stage > previewed && !r.result) { renderPreview(j.preview, url); previewed = stage; }
      const status = j.status === "queued" ? `Queued${j.position ? ` (${j.position} ahead)` : ""}...`
        : j.status === "waiting" ? j.note : null;
      if (r.result) setUpdateNote(status || "Updating to the latest rules...");
      else if ($("progress")) $("progress").innerHTML = (status ? [status] : j.progress).map((p) => `<div>${esc(p)}</div>`).join("");
      if (j.status === "done") { clearError("analysis"); render(j.result, url); loadRuns(); loadBudget(); return; }
      if (j.status === "error") {
        if (r.result) { setUpdateNote(`Couldn't update to the latest rules (${j.error}) - showing the saved analysis.`); return; }
        throw Object.assign(new Error(j.error), {ref: j.ref});
      }
    }
  } catch (e) {
    reportError("analysis", "Analyzing the run", e.message, () => analyze(url, fresh), e.ref);
    $("main").innerHTML = `<div class="card"><h2>Couldn't analyze this run</h2><p class="secempty">The reason is in the
      error banner above.</p><button class="pill" id="retryAnalyze">Try again</button></div>`;
    $("retryAnalyze").onclick = () => analyze(url, fresh);
    loadBudget();
  }
}

// Your run alone (header, group, timeline) while the top logs download; the full analysis replaces it.
function renderPreview(res, url) {
  SP = {...SP, ...res.spec};
  const r = res.run;
  $("main").innerHTML = `<div class="card"><div class="runhead"><h3>${esc(r.dungeon)} +${r.level}</h3>
      <span class="tag ${r.timed ? "timed" : "depleted"}">${r.timed ? "Timed" : "Not timed"}</span></div>
      <div class="meta">${esc(r.player)} (${esc(res.spec.label)}) · ${r.duration_min} min · ${r.deaths} death${r.deaths === 1 ? "" : "s"}</div>
      ${renderGroup(res)}</div>
    <div class="card"><h2>Comparing with your peers</h2><p class="secempty">Your timeline${res.deaths ? ", death recaps and DPS windows are" : " is"} below; findings and the peer bands appear when the comparison is done.</p>
      <div class="progress" id="progress"></div></div>
    ${renderTimelineShell(res)}
    ${res.deaths ? renderDeaths(res) : ""}
    ${res.dps ? sec("dps", (res.dps_windows || []).length || 0, renderDps({...res, timeline: {...res.timeline, dps_windows: res.dps_windows}}),
        "No calm stretches long enough to deal damage in this run.", false) : ""}`;
  if (res.dps_windows) res.timeline.dps_windows = res.dps_windows;
  initTimeline(res, url);
  drawDps();
  paintIcons();
}

// A quiet line above a shown analysis while a newer one is on its way (not an error).
function setUpdateNote(text) {
  let n = $("updateNote");
  if (!n) {
    n = document.createElement("div");
    n.id = "updateNote"; n.className = "updnote";
    $("main").prepend(n);
  }
  n.textContent = text;
}

const CLASS_COLORS = {
  "Death Knight": "#C41E3A", "Demon Hunter": "#A330C9", "Druid": "#FF7C0A", "Evoker": "#33937F",
  "Hunter": "#AAD372", "Mage": "#3FC7EB", "Monk": "#00FF98", "Paladin": "#F48CBA", "Priest": "#B8B8B8",
  "Rogue": "#E6D02E", "Shaman": "#0070DD", "Warlock": "#8788EE", "Warrior": "#C69B6D",
};

function renderGroup(res) {
  if (!res.group || !res.group.length) return "";
  const members = res.group.map((m) => `
    <div class="member"><span class="bar" style="background:${CLASS_COLORS[m.class] || "var(--line)"}"></span>
      <div><div class="role">${esc(m.role)}</div><span class="who">${esc(m.name)}</span>
      <span class="spec">${esc([m.spec, m.class].filter(Boolean).join(" "))}</span>
      ${m.note ? `<div class="note">${esc(m.note)}</div>` : ""}${renderBrings(m)}</div></div>`).join("");
  const notes = (res.comp_notes || []).map((n) => `<div>${esc(n)}</div>`).join("");
  return `<div class="group">${members}</div>${notes ? `<div class="compnote">${notes}</div>` : ""}`;
}

// Group / external cooldowns a member brings, flagged when never pressed or never up for a big group hit.
function renderBrings(m) {
  if (!m.brings || !m.brings.length) return "";
  return `<ul class="brings">${m.brings.map((b) => {
    const tip = `${b.scope === "group" ? "Group" : "External"} cooldown · pressed ${b.casts}x · up for ${b.on_big_hits} of ${m.big_hits} big group hits${b.casts ? "" : " · may not be talented"}`;
    // Externals are single-target (tank busters, one dying player): judged only on being pressed, not on group hits.
    const group = b.scope === "group";
    const missed = !b.casts || (group && !b.on_big_hits && m.big_hits);
    const text = !b.casts ? "never pressed" : !group ? `${b.casts}x` : !b.on_big_hits && m.big_hits
      ? `${b.casts}x, never on a big hit` : `${b.casts}x · ${b.on_big_hits} big hit${b.on_big_hits === 1 ? "" : "s"}`;
    return `<li class="${missed ? "warn" : ""}" title="${esc(tip)}">
      <i style="background:${SCOPE_COLOR[b.scope]}"></i>${esc(b.name)} <span>${text}</span></li>`;
  }).join("")}</ul>`;
}

function renderItems(res) {
  if (!res.items || !res.items.length) return "";
  const pct = (v) => v == null ? "-" : `${Math.round(v * 100)}%`;
  const rows = res.items.map((i) => `<tr><td>${esc(i.name)}</td><td>${esc(i.kind)}</td><td>${i.uses}</td>
    <td>${i.top_uses == null ? "-" : i.top_uses}</td><td>${i.top_users}/${i.top_count}</td>
    <td>${i.ready_pressure_s == null ? "-" : i.ready_pressure_s + "s"}</td>
    <td>${pct(i.paired)}</td><td>${pct(i.top_paired)}</td></tr>`).join("");
  return `<details><summary>Show data</summary><div class="tablewrap"><table>
    <tr><th>Item</th><th>Type</th><th>Your uses</th><th>Top uses*</th><th>Top players using it</th>
    <th>Ready during pressure</th><th>With big cooldowns</th><th>Top with big cooldowns</th></tr>${rows}</table></div>
    <div class="compnote">* median among the peer healers who used it, scaled to your run length.
    "With big cooldowns" = share of uses within 10s of ${esc(SP.majors)}.</div></details>`;
}

// ---------- time links: every m:ss on the page jumps the timeline there ----------
const toSec = (m, s) => +m * 60 + +s;
function linkTimes(html) {
  return html.replace(/(^|[^\d:.])(\d{1,2}):(\d{2})(?:(\s?[-–]\s?)(\d{1,2}):(\d{2}))?(?![\d:])/g,
    (all, pre, m1, s1, sep, m2, s2) => {
      const a = toSec(m1, s1), b = m2 != null ? toSec(m2, s2) : "";
      const text = `${m1}:${s1}` + (m2 != null ? `${sep}${m2}:${s2}` : "");
      return `${pre}<a class="tl" href="#" data-s="${a}" data-e="${b}">${text}</a>`;
    });
}
const T = (s) => linkTimes(esc(s));
document.addEventListener("click", (e) => {
  const a = e.target.closest("a.tl");
  if (!a) return;
  e.preventDefault();
  e.stopPropagation();
  focusTimeline(+a.dataset.s, a.dataset.e ? +a.dataset.e : null);
});

function pullShort(label) {
  if (!label || label === "Whole run") return "";
  const name = (label.split(": ")[1] || label).split(" (boss)")[0].split(" · ")[0];
  const phase = (label.match(/· (P\d)/) || [])[1];
  return name.split(" ")[0] + (phase ? ` ${phase}` : "");
}

// ---------- timeline ----------
// Marker lanes: [marker kind, label, toggle key, short label for narrow screens].
const LANES = [
  ["cooldown", "Healing cooldowns", "l:cooldown", "Cooldowns"], ["personal", "Personal", "l:personal", "Personal"],
  ["trinket", "Your trinkets", "l:trinket", "Trinkets"],
  ["hit", "Big group hits", "l:hit", "Hits"], ["death", "Deaths", "deaths", "Deaths"], ["finding", "Findings", "l:finding", "Findings"],
];
const SCOPE_COLOR = {personal: "var(--series-1)", external: "var(--series-3)", group: "var(--series-7)"};
let TL = null;  // {res, pull, view, mark, tips}
// Everything the chart can show: [key, group, swatch html, label]. They double as the legend.
const TOGGLES = [
  ["group", "Healing", `<i style="background:var(--series-1)"></i>`, "Group HP"],
  ["lowest", "Healing", `<i style="background:var(--series-2)"></i>`, "Lowest player"],
  ["top", "Healing", `<i class="dash"></i>`, "Peers / top players (band)"],
  ["uncovered", "Party", `<i class="box" style="background:var(--critical);opacity:.35"></i>`, "Big hit, your cooldown ready but unused"],
  ["l:cooldown", "Healing", `<i class="box" style="background:var(--text)"></i>`, "Your healing cooldowns"],
  ["l:hit", "Healing", `<i class="tick"></i>`, "Big group hits"],
  ["deaths", "Healing", `<span class="sym" style="color:var(--critical)">✕</span>`, "Deaths"],
  ["l:personal", "Healing", `<i class="box" style="background:var(--text);opacity:.6"></i>`, "Your personal"],
  ["l:trinket", "Other", `<i class="box" style="background:var(--text);opacity:.6"></i>`, "Your trinkets"],
  ["uses", "Party", `<i class="dot" style="background:var(--text)"></i>`, "Potions, healthstones & trinkets (per player)"],
  ["l:finding", "Other", `<i class="dot" style="background:var(--warning)"></i>`, "Finding dots"],
  ["mana", "Healing", `<i style="background:var(--series-1)"></i>`, "Your mana"],
  ["party", "Party", `<span class="sym">▤</span>`, "Party member lanes"],
  ["personal", "Party", `<i class="box" style="background:var(--series-1)"></i>`, "Personal defensives"],
  ["external", "Party", `<i class="box" style="background:var(--series-3)"></i>`, "Externals"],
  ["groupdef", "Party", `<i class="box" style="background:var(--series-7)"></i>`, "Group defensives"],
  ["minor", "Party", `<i class="box" style="background:var(--series-1);opacity:.4"></i>`, "Minor defensives (short CD)"],
  ["avoid", "Party", `<i class="dot" style="background:var(--warning)"></i>`, "Avoidable / ◆ not kicked"],
  ["chain", "Other", `<span class="sym">⛓</span>`, "Chain pulls"],
  ["lust", "Other", `<span class="sym" style="color:var(--high)">⚡</span>`, "Bloodlust"],
  ["ready", "Other", `<i class="box" style="background:var(--good)"></i>`, "Cooldown sat ready"],
];
const SCOPE_KEY = {personal: "personal", external: "external", group: "groupdef"};
// Presets switch whole sets of toggles; any change in the Lanes menu makes it "custom".
const PRESETS = {
  healing: {label: "Healing", on: ["group", "lowest", "top", "l:cooldown", "l:hit", "deaths", "chain", "l:trinket"]},
  party: {label: "Party", on: ["group", "lowest", "top", "uncovered", "l:cooldown", "l:hit", "deaths", "chain", "l:personal",
                               "party", "personal", "external", "groupdef", "avoid", "uses"]},
  everything: {label: "Everything", on: TOGGLES.map((t) => t[0])},
};
let TL_PRESET = PRESETS[lsGet("tlPreset")] || lsGet("tlPreset") === "custom" ? lsGet("tlPreset") : "healing";
const TL_HIDDEN = new Set(TL_PRESET === "custom" ? (lsGet("tlHidden") || "").split(",").filter(Boolean)
  : TOGGLES.map((t) => t[0]).filter((k) => !PRESETS[TL_PRESET].on.includes(k)));
const isOn = (k) => !TL_HIDDEN.has(k);

function applyPreset(name) {
  TL_PRESET = name;
  TL_HIDDEN.clear();
  if (PRESETS[name]) TOGGLES.forEach(([k]) => { if (!PRESETS[name].on.includes(k)) TL_HIDDEN.add(k); });
  lsSet("tlPreset", name);
  lsSet("tlHidden", [...TL_HIDDEN].join(","));
}

// Spell icons (file names from the log) from the public WoW icon CDN.
const iconUrl = (icon) => `https://wow.zamimg.com/images/wow/icons/medium/${encodeURIComponent(icon)}.jpg`;
const iconSvg = (icon, x, y, s, extra = "") => `<image href="${iconUrl(icon)}" x="${x}" y="${y}" width="${s}" height="${s}"
  preserveAspectRatio="xMidYMid slice" ${extra}/><rect x="${x}" y="${y}" width="${s}" height="${s}" rx="2" fill="none"
  stroke="var(--panel)" stroke-width="1" pointer-events="none"/>`;

// Sizes follow the text size (html font-size): timeline text is 13px at Normal, lanes scale with it.
function tlMetrics(W, pinned) {
  const fs = parseFloat(getComputedStyle(document.documentElement).fontSize) * 0.8667;
  return {fs, L: Math.round(fs * (W < 560 ? 6.5 : 10.5)), laneH: Math.round(fs * (pinned ? 1.4 : 1.9))};
}

function fmtClock(s) { s = Math.max(0, Math.round(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }
function lsGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch {} }

function renderTimelineShell(res) {
  const t = res.timeline;
  if (!t || !t.pulls.length) return "";
  const opts = `<option value="-1">Whole run (${fmtClock(t.pulls[0].start_s)}-${fmtClock(t.pulls[t.pulls.length - 1].end_s)})</option>`
    + t.pulls.map((p, i) => `<option value="${i}">${esc(p.label)} (${fmtClock(p.start_s)})</option>`).join("");
  const groups = [...new Set(TOGGLES.map((x) => x[1]))];
  // Lanes menu: the presets on top, then one column per group; each row = checkbox | swatch | label.
  const menu = `<div class="lm-presets">${Object.entries(PRESETS).map(([k, p]) =>
      `<button class="tlbtn" data-preset="${k}">${p.label}</button>`).join("")}</div>
    <div class="lm-groups">${groups.map((gname) => `<fieldset><legend>${gname}</legend>${TOGGLES.filter((x) => x[1] === gname)
      .map(([k, , sw, label]) => `<label><input type="checkbox" data-k="${k}"><span class="sw">${sw}</span><span>${esc(label)}</span></label>`)
      .join("")}</fieldset>`).join("")}</div>`;
  return `<div id="tlSection" class="card">
    <div class="tl-head"><strong class="tl-title">Timeline</strong>
      <span class="scope" id="tlScope"></span>
      <select id="tlPull" aria-label="Pull">${opts}</select>
      <button class="tlbtn" id="tlWhole" title="Show the whole key (or double-click the overview)">Show whole run</button>
      <button class="tlbtn" id="tlZoomOut" hidden>Show whole pull</button>
      <span class="sp"></span>
      <div class="seg" role="group" aria-label="Compare with" id="tlBase">${baseButtons(res)}</div>
      <div class="seg" role="group" aria-label="Timeline preset">${Object.entries(PRESETS).map(([k, p]) =>
        `<button class="tlbtn" data-preset="${k}">${p.label}</button>`).join("")}</div>
      <details class="lanes" id="tlLanes"><summary class="tlbtn">Lanes</summary><div class="lanemenu">${menu}</div></details>
      <button class="tlbtn" id="tlPin" title="Keep the timeline on screen while you read">📌 Pin</button>
      <button class="tlbtn" id="tlFold" hidden>Hide chart</button></div>
    <details class="legend" id="tlLegend"><summary>Legend</summary><div class="legend-items" id="tlLegendItems"></div></details>
    <div class="tlwrap" id="ovWrap"><svg id="ovSvg" role="img" aria-label="Whole run overview: click a pull or drag a range to zoom"></svg>
      <div class="tip" id="ovTip"></div></div>
    <div class="tlwrap" id="tlWrap"><svg id="tlSvg" role="img" aria-label="Group HP, events and defensives over the selected pull"></svg>
      <div class="tip" id="tlTip"></div></div>
    <div class="tlsel" id="tlSel" hidden></div></div>`;
}

// ---------- whole-run overview: pulls side by side, gaps between pulls squeezed ----------
const OV_GAP = 6;
function overviewScale(t, L, plotW) {
  const pulls = t.pulls;
  const total = pulls.reduce((s, p) => s + (p.end_s - p.start_s), 0) || 1;
  const wp = plotW - OV_GAP * Math.max(0, pulls.length - 1);
  let off = L;
  const segs = pulls.map((p) => {
    const w = (p.end_s - p.start_s) / total * wp;
    const seg = {p, x0: off, x1: off + w};
    off += w + OV_GAP;
    return seg;
  });
  const x = (s) => {
    for (let i = 0; i < segs.length; i++) {
      const g = segs[i];
      if (s <= g.p.end_s) return s < g.p.start_s ? g.x0 - OV_GAP / 2 : g.x0 + (s - g.p.start_s) / (g.p.end_s - g.p.start_s) * (g.x1 - g.x0);
    }
    return segs.length ? segs[segs.length - 1].x1 : L;
  };
  const toS = (px) => {
    for (const g of segs) {
      if (px <= g.x1 + OV_GAP / 2) return g.p.start_s + Math.max(0, Math.min(1, (px - g.x0) / (g.x1 - g.x0))) * (g.p.end_s - g.p.start_s);
    }
    const last = segs[segs.length - 1];
    return last ? last.p.end_s : 0;
  };
  return {segs, x, toS};
}

function drawOverview() {
  const t = TL.res.timeline, svg = $("ovSvg"), wrap = $("ovWrap");
  const pinned = $("tlSection").classList.contains("pinned");
  const W = Math.max(320, wrap.clientWidth), R = 8, {fs, L} = tlMetrics(W, pinned), plotW = W - L - R;
  const ready = pinned || !isOn("ready") ? [] : (t.ready_lanes || []);
  const top = Math.round(fs + 6), hpH = pinned ? 30 : Math.round(fs * 3.6), laneH = Math.round(fs * 1.35);
  const readyTop = top + hpH + 8;
  const H = readyTop + ready.length * laneH + (ready.length ? 6 : 0);
  const chained = new Set(t.pulls.map((q, i) => q.chain ? i : -1));
  const {segs, x, toS} = overviewScale(t, L, plotW);
  const y = (v) => top + (1 - v) * hpH;
  let g = "";
  segs.forEach((sg, i) => {
    const sel = i === TL.pull;
    g += `<rect x="${sg.x0}" y="${top}" width="${Math.max(1, sg.x1 - sg.x0)}" height="${hpH}" fill="${sg.p.boss ? "var(--series-7)" : "var(--ink-muted)"}"
      opacity="${sg.p.boss ? .14 : .07}" data-pull="${i}" style="cursor:pointer"/>`;
    if (sel) g += `<rect x="${sg.x0}" y="${top - 1}" width="${sg.x1 - sg.x0}" height="${hpH + 2}" fill="none" stroke="var(--accent)" stroke-width="1.5"/>`;
    let d = "";
    for (let b = Math.floor(sg.p.start_s / t.bin_s); b <= Math.min(t.group.length - 1, Math.ceil(sg.p.end_s / t.bin_s)); b += 3)
      d += `${d ? "L" : "M"}${x(b * t.bin_s).toFixed(1)},${y(t.group[b]).toFixed(1)}`;
    if (isOn("group")) g += `<path d="${d}" fill="none" stroke="var(--series-1)" stroke-width="1.2" pointer-events="none"/>`;
    // ⛓ badge on a pull that was chained into, then the name where it fits
    const badge = chained.has(i) && isOn("chain"), risky = badge && (t.markers.find((m) => m.kind === "chain"
      && Math.abs(m.t_s - sg.p.start_s) < 2) || {}).risky;
    if (badge && sg.x1 - sg.x0 > fs + 2)
      g += `<text x="${sg.x0 + 2}" y="${top - 4}" style="fill:${risky ? "var(--warning)" : "var(--muted)"}">⛓</text>`;
    const label = pullShort(sg.p.label), lx = sg.x0 + (badge ? fs + 6 : 3);
    if (sg.x1 - lx > label.length * fs * 0.58) g += `<text x="${lx}" y="${top - 4}" ${sg.p.boss ? 'style="font-weight:700"' : ""}>${esc(label)}</text>`;
    if (sg.p.deaths && isOn("deaths")) g += `<text x="${sg.x1 - 3}" y="${top + hpH - 4}" text-anchor="end" style="fill:var(--critical);font-weight:700">✕${sg.p.deaths}</text>`;
  });
  if (TL.view) {
    const [a, b] = TL.view;
    g += `<rect x="${x(a)}" y="${top}" width="${Math.max(2, x(b) - x(a))}" height="${hpH}" fill="var(--accent)" opacity=".18" pointer-events="none"/>`;
  }
  t.markers.filter((m) => m.kind === "death" && isOn("deaths")).forEach((m) =>
    g += `<line x1="${x(m.t_s)}" x2="${x(m.t_s)}" y1="${top}" y2="${top + hpH}" stroke="var(--critical)" stroke-width="1.5" pointer-events="none"/>`);
  if (isOn("l:cooldown")) t.markers.filter((m) => m.kind === "cooldown").forEach((m) =>
    g += `<rect x="${x(m.t_s) - 2}" y="${top + hpH - 7}" width="4" height="7" fill="var(--text)" pointer-events="none"/>`);
  (isOn("lust") ? t.lust || [] : []).forEach((l) =>
    g += `<text x="${x(l.t_s)}" y="${top + fs}" text-anchor="middle" style="fill:var(--high)" pointer-events="none">⚡</text>`);
  ready.forEach((ln, i) => {
    const yc = readyTop + i * laneH;
    g += `<rect x="${L}" y="${yc}" width="${plotW}" height="${laneH - 4}" fill="var(--grid)" opacity=".6" pointer-events="none"/>`;
    ln.ready.forEach(([a, b]) => g += `<rect x="${x(a)}" y="${yc}" width="${Math.max(1, x(b) - x(a))}" height="${laneH - 4}"
      fill="var(--good)" opacity=".7" pointer-events="none"/>`);
  });
  // labels
  g += `<text class="lane" x="8" y="${top + fs + 2}">Whole run</text>`;
  ready.forEach((ln, i) => g += `<text class="lane" x="8" y="${readyTop + i * laneH + laneH * 0.62}">${esc(ln.name)}</text>`);
  g += `<rect id="ovDrag" x="0" y="0" width="0" height="${H}" fill="var(--accent)" opacity=".15" pointer-events="none"/>`;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("height", H);
  svg.innerHTML = g;

  const tip = $("ovTip"), drag = $("ovDrag");
  const px = (ev) => { const r = svg.getBoundingClientRect(); return (ev.clientX - r.left) * (W / r.width); };
  let down = null;
  svg.onmousedown = (ev) => { down = px(ev); ev.preventDefault(); };
  svg.onmousemove = (ev) => {
    const p = px(ev);
    if (down != null && Math.abs(p - down) > 4) {
      drag.setAttribute("x", Math.min(p, down)); drag.setAttribute("width", Math.abs(p - down));
      tip.style.display = "none";
      return;
    }
    const sg = segs.find((g) => p >= g.x0 - OV_GAP / 2 && p <= g.x1 + OV_GAP / 2);
    if (!sg) { tip.style.display = "none"; return; }
    const ln = (t.ready_lanes || []).map((l) => {
      const inside = l.ready.reduce((s, [a, b]) => s + Math.max(0, Math.min(b, sg.p.end_s) - Math.max(a, sg.p.start_s)), 0);
      return inside >= 30 ? `${l.name} sat ready ${Math.round(inside)}s` : "";
    }).filter(Boolean);
    tip.innerHTML = `<b>${esc(sg.p.label)}</b><br>${fmtClock(sg.p.start_s)}-${fmtClock(sg.p.end_s)} (${Math.round(sg.p.end_s - sg.p.start_s)}s)
      · ${sg.p.deaths || 0} death${sg.p.deaths === 1 ? "" : "s"}${(sg.p.death_lines || []).map((d) => `<br>✕ ${esc(d)}`).join("")}
      <br>${esc(sg.p.verdict || "")}${sg.p.avoid ? `<br>⚠ ${esc(sg.p.avoid)}` : ""}${sg.p.chain ? `<br>⛓ ${esc(sg.p.chain)}` : ""}${ln.length ? `<br>${esc(ln.join(" · "))}` : ""}`;
    tip.style.display = "block";
    tip.style.left = `${Math.max(0, Math.min(p / W * wrap.clientWidth + 10, wrap.clientWidth - tip.offsetWidth - 4))}px`;
    tip.style.top = `${top + hpH}px`;
  };
  svg.onmouseleave = () => { tip.style.display = "none"; };
  window.onmouseup = (ev) => {
    if (down == null) return;
    const p = px(ev), a = Math.min(p, down), b = Math.max(p, down);
    down = null;
    drag.setAttribute("width", 0);
    if (b - a > 4) {
      const s0 = toS(a), s1 = toS(b);
      focusTimeline(s0, s1);
    } else {
      const i = segs.findIndex((g) => p >= g.x0 - OV_GAP / 2 && p <= g.x1 + OV_GAP / 2);
      if (i >= 0) selectPull(i);
    }
  };
  svg.ondblclick = () => selectPull(-1);
}

// Group defensives arrive as one span per covered player: merge the same cast (name + start within 2s) into one,
// with who it covered in the tooltip. Area effects (Anti-Magic Zone) cover only those who stood in them.
function groupDefenses(defense, members) {
  const name = (id) => (members.find((m) => m.id === id) || {}).name || "pet";
  const out = [];
  for (const d of defense.filter((x) => x.scope === "group").sort((a, b) => a.start_s - b.start_s)) {
    const same = out.find((o) => o.name === d.name && Math.abs(o.start_s - d.start_s) <= 2);
    if (same) { same.end_s = Math.max(same.end_s, d.end_s); same.covered.push(name(d.lane)); continue; }
    out.push({...d, covered: [name(d.lane)]});
  }
  out.forEach((o) => {
    const all = o.covered.length >= members.length;
    o.tip = [o.tip[0].replace(/ on [^ ]+( from)?/, (_, from) => from ? " from" : ""), o.tip[1],
             all ? "Covered the whole group" : `Covered ${o.covered.length} of ${members.length}: ${o.covered.join(", ")}`];
  });
  return out;
}

function markerKind(m) { return m.kind; }

function drawTimeline() {
  const res = TL.res, t = res.timeline, whole = TL.pull < 0, p = whole ? null : t.pulls[TL.pull];
  const pinned = $("tlSection").classList.contains("pinned");
  $("tlPull").value = TL.pull;
  $("tlZoomOut").hidden = !TL.view;
  $("tlWhole").hidden = whole;
  $("tlZoomOut").textContent = whole ? "Show whole run" : "Show whole pull";
  $("tlScope").textContent = (whole ? "Whole run" : pullShort(p.label)) + (TL.view ? " · zoomed" : "");
  const svg = $("tlSvg"), wrap = $("tlWrap");
  const W = Math.max(320, wrap.clientWidth), R = 8, {fs, L, laneH} = tlMetrics(W, pinned), plotW = W - L - R;
  // Whole run: the overview's scale (pulls side by side, gaps squeezed). One pull: linear over the pull or zoom.
  const last = t.pulls[t.pulls.length - 1];
  const [s0, s1] = TL.view || (whole ? [t.pulls[0].start_s, last.end_s] : [p.start_s, Math.max(p.end_s, p.start_s + 1)]);
  // Whole run, zoomed: the pulls inside the view, cut to it - still side by side with the gaps squeezed.
  const wpulls = whole ? t.pulls.filter((q) => q.end_s >= s0 && q.start_s <= s1)
    .map((q) => ({...q, start_s: Math.max(q.start_s, s0), end_s: Math.min(q.end_s, s1), full: q})) : [];
  const dense = whole && !TL.view;  // the full squeezed run: merged marks, no frequent icons
  // Only the lanes the preset shows - plus any lane holding the event a time link just pointed at.
  const marked = (kind) => TL.mark && t.markers.some((m) => markerKind(m) === kind
    && m.t_s >= TL.mark[0] - 1 && m.t_s <= TL.mark[1] + 1);
  const shownLanes = LANES.filter(([kind, , key]) => isOn(key) || marked(kind));
  // Party rows: one "Group" row for group defensives (drawn once, not on every member), then one row per member
  // for personals and externals.
  const groupSpans = groupDefenses(t.defense || [], t.lanes || []);
  const lanes = isOn("party") ? [...(isOn("groupdef") && groupSpans.length ? [{id: "group", name: "Group"}] : []),
                                 ...(t.lanes || [])] : [];
  const hpTop = Math.round(fs + 10), hpH = pinned ? Math.round(fs * 5) : Math.max(180, Math.round(fs * 13));
  const lanesTop = hpTop + hpH + 10;
  const partyTop = lanesTop + shownLanes.length * laneH + (lanes.length ? 10 : 0);
  const manaH = pinned || !isOn("mana") ? 0 : Math.round(fs * 3);
  const manaTop = partyTop + lanes.length * laneH + (manaH ? 12 : 0);
  const axisY = manaTop + manaH + 4, H = Math.round(axisY + fs + 10);
  const span = s1 - s0;
  const sc = whole ? overviewScale({pulls: wpulls}, L, plotW) : null;
  const x = whole ? sc.x : (s) => L + (s - s0) / span * plotW;
  const shown = whole ? wpulls.map((q) => q.full) : [p];
  const pullAt = (s) => whole ? (s >= s0 && s <= s1 ? t.pulls.find((q) => s >= q.start_s && s <= q.end_s) : undefined) : p;
  const yHp = (v) => hpTop + (1 - v) * hpH;
  const yMana = (v) => manaTop + (1 - v) * manaH;
  const ranges = whole ? wpulls.map((q) => [q.start_s, q.end_s]) : [[s0, s1]];
  const stride = whole ? Math.max(1, Math.round(span / t.bin_s / plotW)) : 1;  // ~1 point per pixel
  const pts = (arr, y) => {
    let d = "";
    for (const [a, b] of ranges) {  // a separate stroke per pull - no lines across the squeezed gaps
      const b0 = Math.max(0, Math.floor(a / t.bin_s)), b1 = Math.min(arr.length - 1, Math.ceil(b / t.bin_s));
      let first = true;
      for (let k = b0; k <= b1; k += stride) if (arr[k] != null) {
        d += `${first ? "M" : "L"}${x(k * t.bin_s).toFixed(1)},${y(arr[k]).toFixed(1)}`;
        first = false;
      }
    }
    return d;
  };
  TL.tips = [];
  const tipAttr = (lines) => { TL.tips.push(lines); return `data-tip="${TL.tips.length - 1}" style="cursor:pointer"`; };
  let g = `<rect id="tlHit" x="${L}" y="0" width="${plotW}" height="${H}" fill="transparent"/>`;
  g += `<defs><clipPath id="tlClip"><rect x="${L}" y="0" width="${plotW}" height="${H}"/></clipPath></defs><g clip-path="url(#tlClip)">`;
  if (whole) {  // pull boundaries and names instead of phase names
    sc.segs.forEach((sg) => {
      if (sg.p.boss) g += `<rect x="${sg.x0}" y="${hpTop}" width="${sg.x1 - sg.x0}" height="${axisY - hpTop}" fill="var(--phase-a)"/>`;
      g += `<line x1="${sg.x0}" x2="${sg.x0}" y1="${hpTop - fs}" y2="${axisY}" stroke="var(--axis)" stroke-dasharray="2 3"/>`;
      const label = pullShort(sg.p.label);
      if (sg.x1 - sg.x0 > label.length * fs * 0.6 + 6)
        g += `<text x="${sg.x0 + 3}" y="${hpTop - 5}" ${sg.p.boss ? 'style="font-weight:700"' : ""}>${esc(label)}</text>`;
    });
  } else p.phases.forEach((ph, i) => {
    const xa = x(ph.start_s), xb = x(Math.min(ph.end_s, p.end_s));
    if (i % 2 === 1) g += `<rect x="${xa}" y="${hpTop}" width="${xb - xa}" height="${axisY - hpTop}" fill="var(--phase-a)"/>`;
    g += `<line x1="${xa}" x2="${xa}" y1="${hpTop - fs}" y2="${axisY}" stroke="var(--axis)" stroke-dasharray="2 3"/>`;
    if (xb - xa > ph.name.length * fs * 0.55) g += `<text x="${xa + 4}" y="${hpTop - 5}">${esc(ph.name)}</text>`;
  });
  if (TL.mark) {
    const [ma, mb] = TL.mark;
    g += `<rect x="${x(ma) - 2}" y="${hpTop - 4}" width="${Math.max(4, x(mb) - x(ma) + 4)}" height="${axisY - hpTop + 4}"
      fill="var(--accent)" opacity=".12"/>`;
  }
  t.markers.filter((m) => m.kind === "chain" && isOn("chain") && m.t_s >= s0 - 1 && m.t_s <= s1).forEach((m) => {
    const xm = Math.max(L + 1, x(m.t_s)), col = m.risky ? "var(--warning)" : "var(--axis)";
    g += `<line x1="${xm}" x2="${xm}" y1="${hpTop}" y2="${hpTop + hpH}" stroke="${col}" stroke-width="2" stroke-dasharray="4 3"/>`;
    // In the label row, after a phase name that starts at the same moment - never on top of the HP lines.
    const ph = whole ? null : p.phases.find((q) => Math.abs(q.start_s - m.t_s) < 2);
    const lx = xm + 4 + (ph ? ph.name.length * fs * 0.58 + 8 : 0);
    if (!whole) g += `<text x="${lx}" y="${hpTop - 5}" style="fill:${m.risky ? "var(--warning)" : "var(--muted)"};font-weight:700" ${tipAttr(m.tip)}>⛓ chained in</text>`;
  });
  if (isOn("top")) {  // say why there's no band, instead of silently drawing nothing
    const why = res.preview ? "Peer and top-player bands appear when the comparison is done"
      : !whole && !curveOf(p) ? (BASE === "top" ? "No top-player data for this pull" : "No peer data for this pull")
      : !whole && BASE === "top" && p.study_approx ? "Top players: band from the most similar pack (approximate)" : "";
    if (why) g += `<text x="${W - R - 6}" y="${hpTop + fs + 4}" text-anchor="end" style="font-style:italic">${esc(why)}</text>`;
  }
  (isOn("uncovered") ? t.uncovered_hits || [] : []).filter((s) => s >= s0 && s <= s1).forEach((s) =>
    g += `<rect x="${x(s) - 2}" y="${hpTop}" width="4" height="${hpH}" fill="var(--critical)" opacity=".25"/>`);
  [0, 0.5, 1].forEach((v) => g += `<line x1="${L}" x2="${W - R}" y1="${yHp(v)}" y2="${yHp(v)}" stroke="var(--grid)"/>`);
  shown.filter((q) => curveOf(q) && isOn("top")).forEach((q) => {
    const xs = (f) => x(q.start_s + f * (q.end_s - q.start_s));
    const cv = curveOf(q), at = (f) => q.start_s + f * (q.end_s - q.start_s);
    const iA = Math.max(0, cv.findIndex(([f]) => at(f) >= s0) - 1);
    let iB = cv.findIndex(([f]) => at(f) > s1); iB = iB < 0 ? cv.length - 1 : iB;
    const inV = cv.slice(iA, iB + 1);  // the points in view plus one beyond each edge
    const upper = inV.map(([f, , , hi]) => `${xs(f).toFixed(1)},${yHp(hi).toFixed(1)}`);
    const lower = inV.slice().reverse().map(([f, lo]) => `${xs(f).toFixed(1)},${yHp(lo).toFixed(1)}`);
    g += `<polygon points="${upper.concat(lower).join(" ")}" fill="var(--ink-muted)" opacity=".16"/>`;
    g += `<path d="M${curveOf(q).map(([f, , med]) => `${xs(f).toFixed(1)},${yHp(med).toFixed(1)}`).join("L")}"
      fill="none" stroke="var(--ink-muted)" stroke-dasharray="4 3" stroke-width="1.5"/>`;
  });
  if (isOn("lowest")) g += `<path d="${pts(t.lowest, yHp)}" fill="none" stroke="var(--series-2)" stroke-width="1.5" stroke-linejoin="round"/>`;
  if (isOn("group")) g += `<path d="${pts(t.group, yHp)}" fill="none" stroke="var(--series-1)" stroke-width="2" stroke-linejoin="round"/>`;
  const inView = t.markers.filter((m) => m.t_s >= s0 && m.t_s <= s1 && (!whole || pullAt(m.t_s))
    && !(m.kick && !isOn("avoid")));
  const near = (m) => TL.mark && m.t_s >= TL.mark[0] - 1 && m.t_s <= TL.mark[1] + 1 ? ` class="flashmark"` : "";
  // Whole run: markers closer than CLUSTER_PX merge into one, drawn as the most important of them,
  // with a tooltip listing them all.
  const CLUSTER_PX = Math.round(fs * 0.8);
  const r = Math.max(4, Math.round(fs * 0.38));  // marker half-size
  const weight = (m) => (m.severity || 0) + (m.covered === false ? 50 : 0) + (m.kick || m.avoid ? 20 : 0);
  const clusters = (ms) => {
    if (!dense) return ms.map((m) => [m]);
    const out = [];
    for (const m of ms.slice().sort((a, b) => a.t_s - b.t_s)) {
      const c = out[out.length - 1];
      if (c && x(m.t_s) - x(c[0].t_s) < CLUSTER_PX) c.push(m); else out.push([m]);
    }
    return out;
  };
  const clusterTip = (grp, label) => grp.length === 1 ? (grp[0].tip || [grp[0].label]) : [
    `${grp.length} × ${label} · ${fmtClock(grp[0].t_s)}-${fmtClock(grp[grp.length - 1].t_s)}`,
    ...grp.slice(0, 6).map((m) => `${fmtClock(m.t_s)} ${m.label}${m.avoid ? ` (${m.avoid})` : ""}`),
    ...(grp.length > 6 ? [`+${grp.length - 6} more - pick the pull to see them`] : [])];
  shownLanes.forEach(([kind, label], i) => {
    const yc = lanesTop + i * laneH + laneH / 2;
    g += `<line x1="${L}" x2="${W - R}" y1="${yc}" y2="${yc}" stroke="var(--grid)"/>`;
    clusters(inView.filter((m) => markerKind(m) === kind)).forEach((grp) => {
      const m = grp.reduce((best, c) => weight(c) > weight(best) ? c : best, grp[0]);
      const xm = x(m.t_s), tip = tipAttr(clusterTip(grp, label));
      if (kind === "death") {
        g += `<path${near(m)} d="M${xm - r},${yc - r}L${xm + r},${yc + r}M${xm + r},${yc - r}L${xm - r},${yc + r}" stroke="var(--critical)" stroke-width="2.5" ${tip}/>`;
        g += `<rect x="${xm - r - 3}" y="${yc - r - 3}" width="${2 * r + 6}" height="${2 * r + 6}" fill="transparent" ${tip}/>`;
      } else if (kind === "finding") {
        const col = m.severity >= 70 ? "var(--critical)" : m.severity >= 45 ? "var(--warning)" : "var(--ink-muted)";
        g += `<circle${near(m)} cx="${xm}" cy="${yc}" r="${r + 1}" fill="${col}" stroke="var(--panel)" stroke-width="2" data-f="${m.index}" ${tip}/>`;
      } else if (kind === "hit" && m.kick) {
        g += `<path${near(m)} d="M${xm},${yc - r - 1}L${xm + r + 1},${yc}L${xm},${yc + r + 1}L${xm - r - 1},${yc}Z" fill="var(--warning)" ${tip}/>`;
      } else if (kind === "hit") {
        g += `<line${near(m)} x1="${xm}" x2="${xm}" y1="${yc - r - 1}" y2="${yc + r + 1}" stroke="${m.covered === false ? "var(--critical)" : "var(--muted)"}"
          stroke-width="3" stroke-linecap="round" ${tip}/>`;
        if (m.avoid && isOn("avoid")) g += `<circle cx="${xm}" cy="${yc - r - 4}" r="2.5" fill="var(--warning)" pointer-events="none"/>`;
      } else if (m.icon && (!dense || ((kind === "trinket" || kind === "potion") && grp.every((c) => c.icon === m.icon)))) {
        // The spell's icon; name and details on hover. Whole run: only rare items, and only when a merged group is all
        // the same item - frequent presses (cooldowns, personals) merge, so one icon would misname the others.
        const s = laneH - 4;
        g += `<g${near(m)}>${iconSvg(m.icon, xm - s / 2, yc - s / 2, s, tip)}</g>`;
      } else {
        g += `<rect${near(m)} x="${xm - r}" y="${yc - r - 2}" width="${2 * r}" height="${2 * r + 4}" rx="2" fill="var(--text)" opacity=".75" ${tip}/>`;
      }
    });
  });
  const barH = Math.max(8, laneH - 6);
  lanes.forEach((ln, i) => {
    const yc = partyTop + i * laneH + laneH / 2;
    g += `<line x1="${L}" x2="${W - R}" y1="${yc}" y2="${yc}" stroke="var(--grid)"/>`;
    (ln.id === "group" ? groupSpans : (t.defense || []).filter((d) => d.lane === ln.id && d.scope !== "group"))
      .filter((d) => isOn(SCOPE_KEY[d.scope]) && (!d.minor || isOn("minor")) && d.end_s >= s0 && d.start_s <= s1)
      .sort((a, b) => a.start_s - b.start_s).forEach((d, k, all) => {
      const xa = x(Math.max(d.start_s, s0)), xb = x(Math.min(d.end_s, s1)), w = Math.max(3, xb - xa), tip = tipAttr(d.tip);
      g += `<rect x="${xa}" y="${yc - barH / 2}" width="${w}" height="${barH}" rx="2" fill="${SCOPE_COLOR[d.scope]}"
        opacity="${d.minor ? .3 : d.protective ? .55 : .35}" ${tip}/>`;
      // The icon at the start of the bar says what was pressed; icons of overlapping spans sit side by side.
      // Whole run: bars only (too squeezed - icons would drift off their bars); the name is on hover.
      const slot = all.slice(0, k).filter((o) => o.end_s > d.start_s && x(d.start_s) - x(o.start_s) < barH).length;
      if (d.icon && !dense && (w >= barH || slot)) g += iconSvg(d.icon, xa + slot * (barH + 1), yc - barH / 2, barH, tip);
    });
    // That player's potions / healthstones / trinkets: an icon in pull view, a small dot in the squeezed whole run.
    if (isOn("uses") && ln.id !== "group") (t.uses || []).filter((u) => u.lane === ln.id && u.t_s >= s0 && u.t_s <= s1
        && (!whole || pullAt(u.t_s))).forEach((u) => {
      const xu = x(u.t_s), tip = tipAttr(u.tip), s = Math.round(barH * 0.85);
      g += !dense && u.icon
        ? `<g>${iconSvg(u.icon, xu - s / 2, yc - s / 2, s, tip)}<rect x="${xu - s / 2 - 1.5}" y="${yc - s / 2 - 1.5}"
            width="${s + 3}" height="${s + 3}" rx="3" fill="none" stroke="var(--high)" stroke-width="1.5" pointer-events="none"/></g>`
        : `<circle cx="${xu}" cy="${yc}" r="${Math.max(3, r * 0.7)}" fill="var(--text)" stroke="var(--panel)" stroke-width="1.5" ${tip}/>`;
    });
  });
  if (manaH && t.mana.length) {
    [0, 1].forEach((v) => g += `<line x1="${L}" x2="${W - R}" y1="${yMana(v)}" y2="${yMana(v)}" stroke="var(--grid)"/>`);
    g += `<path d="${pts(t.mana, yMana)}" fill="none" stroke="var(--series-1)" stroke-width="2"/>`;
  }
  g += `</g>`;
  // labels outside the clip
  const mid = fs * 0.35;  // baseline offset that centres text on a lane
  [0, 0.5, 1].forEach((v) => g += `<text x="${L - 6}" y="${yHp(v) + mid}" text-anchor="end">${v * 100}%</text>`);
  g += `<text class="lane" x="8" y="${hpTop + fs}">HP</text>`;
  shownLanes.forEach(([, label, , short], i) =>
    g += `<text class="lane" x="8" y="${lanesTop + i * laneH + laneH / 2 + mid}">${W < 560 ? short : label}</text>`);
  lanes.forEach((ln, i) => {
    const yc = partyTop + i * laneH + laneH / 2;
    g += `<rect x="8" y="${yc - fs / 2}" width="3" height="${fs}" fill="${ln.id === "group" ? "var(--series-7)" : CLASS_COLORS[ln.class] || "var(--line)"}"/>
      <text class="lane" x="16" y="${yc + mid}" ${ln.id === "group" ? 'style="font-weight:700"' : ""}>${esc(ln.name)}</text>`;
  });
  if (manaH) g += `<text class="lane" x="8" y="${manaTop + fs}">Your mana</text>`;
  const tickY = axisY + fs + 2;
  if (dense) {  // run time at pull starts that have room for a label
    let lastX = -1e9;
    wpulls.forEach((q) => {
      const xq = x(q.start_s);
      if (xq - lastX >= fs * 4) { g += `<text x="${xq}" y="${tickY}" text-anchor="start">${fmtClock(q.start_s)}</text>`; lastX = xq; }
    });
  } else {  // a pull, or the whole run zoomed in: regular clock steps (only inside pulls when zoomed across several)
    const fight = whole ? wpulls.reduce((s, q) => s + q.end_s - q.start_s, 0) : span;
    const minStep = fight / (plotW / (fs * 5));  // labels at least ~5 characters apart
    const step = [5, 10, 15, 30, 60, 120, 300].find((s) => s >= minStep) || 600;
    let lastX = -1e9;
    for (let s = Math.ceil(s0 / step) * step; s <= s1; s += step) {
      if (whole && !pullAt(s)) continue;
      const xs = x(s);
      if (xs - lastX < fs * 3.5) continue;
      g += `<text x="${xs}" y="${tickY}" text-anchor="middle">${fmtClock(s)}</text>`;
      lastX = xs;
    }
  }
  if (TL.sel && TL.selBand && TL.sel[1] >= s0 && TL.sel[0] <= s1) {  // a selection that couldn't be zoomed to
    const xa = x(Math.max(TL.sel[0], s0)), xb = x(Math.min(TL.sel[1], s1));
    g += `<rect x="${xa}" y="${hpTop}" width="${Math.max(2, xb - xa)}" height="${axisY - hpTop}" fill="var(--accent)" opacity=".12"
      stroke="var(--accent)" stroke-dasharray="3 3" pointer-events="none"/>`;
  }
  g += `<rect id="tlDrag" x="0" y="${hpTop}" width="0" height="${axisY - hpTop}" fill="var(--accent)" opacity=".18" pointer-events="none"/>`;
  g += `<line id="tlCross" x1="0" x2="0" y1="${hpTop}" y2="${axisY}" stroke="var(--text)" stroke-width="1" opacity="0" pointer-events="none"/>`;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("height", H);
  svg.innerHTML = g;

  const tip = $("tlTip"), cross = $("tlCross");
  const place = (xm, html) => {
    tip.innerHTML = html;
    tip.style.display = "block";
    const left = Math.min(xm / W * wrap.clientWidth + 12, wrap.clientWidth - tip.offsetWidth - 4);
    tip.style.left = `${Math.max(0, left)}px`;
    tip.style.top = `${hpTop}px`;
  };
  const toS = (ev) => {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * (W / r.width);
    return whole ? sc.toS(px) : s0 + (px - L) / plotW * span;
  };
  svg.onmousemove = (ev) => {
    const s = Math.min(s1, Math.max(s0, toS(ev))), xm = x(s);
    cross.setAttribute("x1", xm); cross.setAttribute("x2", xm); cross.setAttribute("opacity", ".35");
    const el = ev.target.closest("[data-tip]");
    if (el) {
      const lines = TL.tips[+el.dataset.tip];
      place(xm, `<b>${T(lines[0])}</b>${lines.slice(1).map((l) => `<br>${T(l)}`).join("")}`);
      return;
    }
    const b = Math.round(s / t.bin_s), pct = (v) => v == null ? "-" : `${Math.round(v * 100)}%`;
    const q = pullAt(s) || p;
    if (!q) { tip.style.display = "none"; return; }
    const phase = q.phases.find((ph) => s >= ph.start_s && s < ph.end_s);
    const topAt = curveOf(q) ? curveOf(q)[Math.max(0, Math.min(curveOf(q).length - 1,
      Math.round((s - q.start_s) / (q.end_s - q.start_s) * (curveOf(q).length - 1))))] : null;
    place(xm, `<b>${fmtClock(s)}</b>${whole ? ` · ${esc(pullShort(q.label))}` : ""}${phase ? ` · ${esc(phase.name)}` : ""}<br>
      Group <b>${pct(t.group[b])}</b> · Lowest <b>${pct(t.lowest[b])}</b> · Mana <b>${pct(t.mana[b])}</b>
      ${topAt ? `<br>${BASE === "top" ? "Top players" : "Peers"} here: <b>${pct(topAt[2])}</b> (middle half ${pct(topAt[1])}-${pct(topAt[3])})` : ""}`);
  };
  svg.onmouseleave = () => { tip.style.display = "none"; cross.setAttribute("opacity", "0"); };
  // Ctrl+wheel (or a trackpad pinch) zooms around the cursor; a plain wheel keeps scrolling the page.
  svg.onwheel = (ev) => {
    if (!ev.ctrlKey) return;
    ev.preventDefault();
    const s = toS(ev), f = ev.deltaY > 0 ? 1.25 : 0.8;
    zoomAt(s, f);
    drawTimeline();
  };
  svg.ondblclick = () => { if (TL.view) { TL.view = null; drawTimeline(); } };
  // Drag: pans when zoomed into a pull; otherwise (or with Shift) selects a range to analyze.
  svg.onmousedown = (ev) => {
    if (ev.button !== 0) return;
    ev.preventDefault();
    TL.noClick = false;  // a drag sets it to skip its own click; browsers don't always send that click, so reset here
    TL.drag = {x0: ev.clientX, s0: toS(ev), pan: !!TL.view && !ev.shiftKey, moved: false,
               view: TL.view && [...TL.view], perPx: span / plotW * (W / svg.getBoundingClientRect().width)};
  };
  TL.dragMove = (ev) => {
    const d = TL.drag;
    if (Math.abs(ev.clientX - d.x0) > 4) d.moved = true;
    if (!d.moved) return;
    if (d.pan) {
      const [lo, hi] = viewBounds(), w = d.view[1] - d.view[0];
      const a = Math.min(hi - w, Math.max(lo, d.view[0] - (ev.clientX - d.x0) * d.perPx));
      TL.view = [a, a + w];
      drawTimeline();
    } else {
      const s = Math.min(s1, Math.max(s0, toS(ev))), xa = x(Math.min(s, d.s0)), xb = x(Math.max(s, d.s0));
      $("tlDrag").setAttribute("x", xa); $("tlDrag").setAttribute("width", xb - xa);
    }
  };
  TL.dragEnd = (ev) => {
    const d = TL.drag;
    TL.drag = null;
    if (!d.moved) return;
    TL.noClick = true;
    if (!d.pan) {
      const s = Math.min(s1, Math.max(s0, toS(ev)));
      if (Math.abs(s - d.s0) >= 1) {
        const a = Math.min(s, d.s0), b = Math.max(s, d.s0);
        TL.sel = [a, b];
        renderSelection();
        // Zoom to exactly the selection, in a pull or in the whole run (there it may span several pulls).
        const [lo, hi] = viewBounds();
        TL.view = [Math.max(lo, a), Math.min(hi, b)];
        TL.selBand = false;
        TL.mark = null;
      }
      drawTimeline();
    }
  };
  svg.onclick = (ev) => {
    if (TL.noClick) { TL.noClick = false; return; }
    const f = ev.target.closest("[data-f]");
    if (f) return flashFinding(+f.dataset.f);
    if (whole && !TL.view) {  // click a pull in the whole-run view to open it (zoomed: double-click resets instead)
      const q = pullAt(toS(ev));
      if (q) selectPull(t.pulls.indexOf(q));
    }
  };
  drawOverview();
}

// The time range a view can show: the open pull, or the whole run.
function viewBounds() {
  const pulls = TL.res.timeline.pulls, p = pulls[TL.pull];
  return p ? [p.start_s, Math.max(p.end_s, p.start_s + 1)] : [pulls[0].start_s, pulls[pulls.length - 1].end_s];
}

// Zoom the open pull or the whole run by factor f around run time s (f < 1 zooms in); unzoomed when it covers it.
function zoomAt(s, f) {
  const [lo, hi] = viewBounds();
  const [v0, v1] = TL.view || [lo, hi], w = Math.min(hi - lo, Math.max(5, (v1 - v0) * f));
  if (w >= hi - lo - 0.5) { TL.view = null; return; }
  const a = Math.min(hi - w, Math.max(lo, s - (s - v0) * (w / (v1 - v0))));
  TL.view = [a, a + w];
}

// "Analyze selection": a summary of just the dragged time range, from the timeline data already on the page.
function renderSelection() {
  const box = $("tlSel"), t = TL.res.timeline, [a, b] = TL.sel;
  const b0 = Math.max(0, Math.floor(a / t.bin_s)), b1 = Math.min(t.group.length - 1, Math.ceil(b / t.bin_s));
  // Only in-combat time counts: a range across pulls leaves out the gaps between them.
  const inPull = (s) => t.pulls.some((q) => s >= q.start_s && s <= q.end_s);
  const bins = [];
  for (let k = b0; k <= b1; k++) if (inPull(k * t.bin_s)) bins.push(k);
  const pullsIn = t.pulls.filter((q) => q.end_s >= a && q.start_s <= b);
  const fight = pullsIn.reduce((s, q) => s + Math.max(0, Math.min(b, q.end_s) - Math.max(a, q.start_s)), 0);
  const secs = Math.max(1, fight), pct = (v) => v == null ? "-" : `${Math.round(v * 100)}%`;
  const gapNote = pullsIn.length > 1 ? ` · ${pullsIn.length} pulls, ${Math.round(fight)}s in combat (gaps between pulls left out)` : "";
  const avg = (arr) => { const v = bins.map((k) => arr[k]).filter((x) => x != null); return v.length ? v.reduce((s, x) => s + x, 0) / v.length : null; };
  const lowest = Math.min(...bins.map((k) => t.lowest[k] ?? 1));
  // Top groups at the same point of each overlapping pull (their middle line), averaged.
  const topVals = [];
  t.pulls.forEach((q) => {
    if (!curveOf(q) || q.end_s < a || q.start_s > b) return;
    for (let s = Math.max(a, q.start_s); s <= Math.min(b, q.end_s); s += t.bin_s) {
      const i = Math.round((s - q.start_s) / (q.end_s - q.start_s) * (curveOf(q).length - 1));
      topVals.push(curveOf(q)[Math.max(0, Math.min(curveOf(q).length - 1, i))][2]);
    }
  });
  const top = topVals.length ? topVals.reduce((s, x) => s + x, 0) / topVals.length : null;
  const intake = bins.reduce((s, k) => s + ((t.intake || [])[k] || 0), 0);
  const inFrac = bins.reduce((s, k) => s + ((t.intake_frac || [])[k] || 0), 0) / secs;
  const avoidBy = {};
  (t.avoid_hits || []).forEach(([k, n, amt]) => { if (k >= b0 && k <= b1) avoidBy[n] = (avoidBy[n] || 0) + amt; });
  const avoid = Object.values(avoidBy).reduce((s, x) => s + x, 0);
  const avoidNames = Object.entries(avoidBy).sort((x, y) => y[1] - x[1]).slice(0, 3).map(([n]) => n);
  const casts = bins.reduce((s, k) => s + ((t.casts || [])[k] || 0), 0);
  const inside = (s) => s >= a && s <= b;
  const marks = (kinds) => t.markers.filter((m) => kinds.includes(m.kind) && inside(m.t_s));
  const list = (ms, fmt) => ms.length ? ms.map(fmt).join(", ") : "none";
  const defs = {};
  (t.defense || []).filter((d) => inside(d.start_s)).forEach((d) => { defs[d.name] = (defs[d.name] || 0) + 1; });
  const groupDefs = groupDefenses((t.defense || []).filter((d) => inside(d.start_s)), t.lanes || []).length;
  const name = (id) => ((t.lanes || []).find((l) => l.id === id) || {}).name || "?";
  const uses = (t.uses || []).filter((u) => inside(u.t_s));
  const findings = marks(["finding"]);
  const onePull = -1;  // selecting zooms to the range itself now
  box.innerHTML = `<div class="tlselhead"><b>Selection ${fmtClock(a)}-${fmtClock(b)} <span style="font-weight:400">(${pullsIn.length > 1 ? esc(gapNote.slice(3)) : `${Math.round(secs)}s`})</span></b>
      ${onePull >= 0 ? `<button class="tlbtn" id="tlSelZoom">Zoom to it</button>` : ""}
      <button class="tlbtn" id="tlSelClose" aria-label="Close selection">✕</button></div>
    <ul>
      <li><strong>Group HP:</strong> ${pct(avg(t.group))} average, lowest player ${pct(lowest)}${top != null
        ? ` · ${BASE === "top" ? "top players" : "peers"} ${pct(top)} at the same points` : ""}</li>
      <li><strong>Damage taken:</strong> ${(inFrac * 100).toFixed(1)}% of group HP per second${intake && avoid
        ? ` · ${pct(avoid / intake)} avoidable (${esc(avoidNames.join(", "))})` : " · nothing tagged avoidable"}</li>
      <li><strong>Your casts:</strong> ${casts} (${Math.round(casts / secs * 60)} per minute) · cooldowns:
        ${esc(list(marks(["cooldown", "personal", "trinket"]), (m) => `${m.label} ${fmtClock(m.t_s)}`))}</li>
      <li><strong>Defensives pressed:</strong> ${Object.keys(defs).length
        ? esc(Object.entries(defs).map(([n, c]) => c > 1 ? `${n} ×${c}` : n).join(", ")) : "none"}${groupDefs ? ` (${groupDefs} group-wide)` : ""}</li>
      <li><strong>Potions / healthstones / trinkets:</strong> ${esc(list(uses, (u) => `${u.name} (${name(u.lane)}) ${fmtClock(u.t_s)}`))}</li>
      <li><strong>Deaths:</strong> ${esc(list(marks(["death"]), (m) => `${m.label} ${fmtClock(m.t_s)}`))}</li>
      <li><strong>Findings:</strong> ${findings.length ? findings.map((m) =>
        `<a class="link" href="#" data-sf="${m.index}">${esc(m.label)}</a>`).join(", ") : "none"}</li>
    </ul>`;
  box.hidden = false;
  $("tlSelClose").onclick = () => { TL.sel = null; box.hidden = true; drawTimeline(); updatePinHeight(); };
  if (onePull >= 0) $("tlSelZoom").onclick = () => {
    const q = t.pulls[onePull];
    TL.pull = onePull; lsSet(`pull:${TL.url}`, onePull); filterLook(onePull);
    TL.view = [Math.max(q.start_s, a), Math.min(q.end_s, b)]; TL.mark = null; TL.selBand = false;
    drawTimeline(); renderSelection();
  };
  box.querySelectorAll("[data-sf]").forEach((el) => el.onclick = (e) => { e.preventDefault(); flashFinding(+el.dataset.sf); });
  updatePinHeight();
}

// i = pull index, or -1 for the whole run. Also filters "What to look at" to that pull.
function selectPull(i) {
  TL.pull = i; TL.view = null; TL.mark = null;
  lsSet(`pull:${TL.url}`, i);
  drawTimeline();
  filterLook(i < 0 ? null : i);
}

function focusTimeline(s, e) {
  if (!TL) return;
  const pulls = TL.res.timeline.pulls;
  let i = pulls.findIndex((p) => s >= p.start_s - 1 && s <= p.end_s + 1);
  if (i < 0) i = pulls.reduce((best, p, k) => Math.abs(p.start_s - s) < Math.abs(pulls[best].start_s - s) ? k : best, 0);
  const p = pulls[i], end = e != null ? e : s;
  const pad = e != null ? Math.max(3, (end - s) * 0.15) : 15;
  TL.pull = i;
  TL.view = [Math.max(p.start_s, s - pad), Math.min(p.end_s, end + pad)];
  if (TL.view[1] - TL.view[0] < 6) TL.view = [p.start_s, p.end_s];
  TL.mark = [s, end];
  drawTimeline();
  if (!$("tlSection").classList.contains("pinned")) $("tlSection").scrollIntoView({behavior: "smooth", block: "start"});
}

function flashFinding(i) {
  const el = document.querySelector(`.finding[data-i="${i}"]`);
  if (!el) return;
  if (el.hidden) filterLook(null);
  el.open = true;
  el.scrollIntoView({behavior: "smooth", block: "center"});
  el.classList.add("flash");
  setTimeout(() => el.classList.remove("flash"), 1600);
}

function setPinned(on) {
  const sec = $("tlSection");
  sec.classList.toggle("pinned", on);
  sec.classList.remove("collapsed");
  $("tlPin").classList.toggle("on", on);
  $("tlPin").textContent = on ? "📌 Pinned" : "📌 Pin";
  $("tlFold").hidden = !on;
  $("tlFold").textContent = "Hide chart";
  lsSet("tlPinned", on ? "1" : "0");
  drawTimeline();
  updatePinHeight();
}

// Preset buttons, Lanes checkboxes and the legend (only what is shown) follow TL_HIDDEN.
function syncToggles() {
  document.querySelectorAll("#tlSection [data-preset]").forEach((b) => b.classList.toggle("on", b.dataset.preset === TL_PRESET));
  document.querySelectorAll("#tlLanes input[data-k]").forEach((cb) => { cb.checked = isOn(cb.dataset.k); });
  $("tlLegendItems").innerHTML = TOGGLES.filter(([k]) => isOn(k) && k !== "party")
    .map(([, , sw, label]) => `<span>${sw}${esc(label)}</span>`).join("")
    + `<span class="hint">Overview: click a pull to open it, drag a range to zoom, double-click for the whole run.
      Chart: Ctrl+wheel zooms, drag pans when zoomed, drag (or Shift+drag) selects a range to analyze, double-click resets.</span>`;
}

function updatePinHeight() {
  const sec = $("tlSection");
  const h = sec && sec.classList.contains("pinned") ? sec.offsetHeight : 0;
  document.documentElement.style.setProperty("--pin-h", `${h}px`);
}

function initTimeline(res, url) {
  if (!res.timeline || !res.timeline.pulls.length) return;
  // Whole run unless a pull was picked for this run before (remembered per run).
  const saved = +(lsGet(`pull:${url}`) ?? -1);
  TL = {res, url, pull: saved < res.timeline.pulls.length ? saved : -1, view: null, mark: null, tips: []};
  if (TL.pull >= 0) filterLook(TL.pull);
  if (!window.tlDragBound) {  // chart drags (pan / select) keep tracking outside the chart
    window.tlDragBound = true;
    window.addEventListener("mousemove", (ev) => { if (TL && TL.drag) TL.dragMove(ev); });
    window.addEventListener("mouseup", (ev) => { if (TL && TL.drag) TL.dragEnd(ev); });
  }
  $("tlPull").onchange = (e) => selectPull(+e.target.value);
  $("tlWhole").onclick = () => selectPull(-1);
  document.querySelectorAll("#tlSection [data-preset]").forEach((b) => b.onclick = () => {
    applyPreset(b.dataset.preset);
    syncToggles();
    drawTimeline();
  });
  document.querySelectorAll("#tlLanes input[data-k]").forEach((cb) => cb.onchange = () => {
    if (cb.checked) TL_HIDDEN.delete(cb.dataset.k); else TL_HIDDEN.add(cb.dataset.k);
    TL_PRESET = Object.keys(PRESETS).find((p) => TOGGLES.every(([k]) => PRESETS[p].on.includes(k) === isOn(k))) || "custom";
    lsSet("tlPreset", TL_PRESET);
    lsSet("tlHidden", [...TL_HIDDEN].join(","));
    syncToggles();
    drawTimeline();
  });
  $("tlLegend").open = lsGet("tlLegend") === "1";
  $("tlLegend").ontoggle = () => lsSet("tlLegend", $("tlLegend").open ? "1" : "0");
  syncToggles();
  $("tlZoomOut").onclick = () => { TL.view = null; drawTimeline(); };
  document.querySelectorAll("#tlBase [data-base]").forEach((b) => b.onclick = () => setBase(b.dataset.base));
  $("tlPin").onclick = () => setPinned(!$("tlSection").classList.contains("pinned"));
  $("tlFold").onclick = () => {
    const c = $("tlSection").classList.toggle("collapsed");
    $("tlFold").textContent = c ? "Show chart" : "Hide chart";
    updatePinHeight();
  };
  setPinned(lsGet("tlPinned") === "1");
}
window.addEventListener("resize", () => { if (TL && $("tlSvg")) { drawTimeline(); updatePinHeight(); drawDps(); } });

// ---------- sections ----------
const SECTIONS = {
  look: {title: "What to look at", icon: "!", lucide: "triangle-alert", color: "var(--high)"},
  deaths: {title: "Death recaps", icon: "✕", lucide: "skull", color: "var(--critical)"},
  phases: {title: "Boss phases", icon: "◐", lucide: "layers", color: "var(--series-7)"},
  items: {title: "Trinkets & consumables", icon: "◆", lucide: "flask-conical", color: "var(--series-3)"},
  spells: {title: "Single-target vs group heal", icon: "≈", lucide: "split", color: "var(--series-1)"},
  dps: {title: "DPS windows", icon: "⚔", lucide: "swords", color: "var(--series-3)"},
  pulls: {title: "Pulls vs peers", icon: "▤", lucide: "rows-3", color: "var(--ink-muted)"},
  good: {title: "Good calls", icon: "✓", lucide: "circle-check", color: "var(--good)"},
};

function sec(id, count, body, emptyText, foldable = true) {
  const s = SECTIONS[id];
  const tools = foldable && count ? `<button onclick="foldAll('${id}', true)">Expand all</button>
    <button onclick="foldAll('${id}', false)">Collapse all</button>` : "";
  return `<section class="sec card" id="sec-${id}" style="--acc:${s.color}">
    <div class="sechead"><span class="ico"><i data-lucide="${s.lucide}">${s.icon}</i></span><h2>${s.title}</h2>
      <span class="badge">${count}</span><span class="sp"></span>${tools}</div>
    ${count ? body : `<div class="secempty">${esc(emptyText)}</div>`}</section>`;
}

function foldAll(id, open) {
  document.querySelectorAll(`#sec-${id} details`).forEach((d) => {
    d.open = open;
  });
}

function nav(counts) {
  return `<nav class="secnav">${Object.entries(SECTIONS).map(([id, s]) =>
    `<a href="#sec-${id}" style="--acc:${s.color}" onclick="event.preventDefault();
      document.getElementById('sec-${id}').scrollIntoView({behavior:'smooth'})">${s.title}<span class="n">${counts[id] ?? ""}</span></a>`).join("")}</nav>`;
}

// A verdict section: headline as the collapsed line, lines + data on expand.
function verdictBlock(v, dataHtml) {
  if (!v || !v.headline) return dataHtml || "";
  const lines = (v.lines || []).map((l) => `<li class="${l.action ? "act" : "okay"}">
      <span class="mark">${l.action ? "→" : "✓"}</span><span>${T(l.text)}
      ${l.examples.length ? `<span class="ex">${l.examples.map((e) => `<span>${T(e)}</span>`).join("")}</span>` : ""}</span></li>`).join("");
  return `<details class="vsec ${v.ok ? "ok" : "todo"}"><summary>${v.ok ? "✓" : "→"} ${T(v.headline)}</summary>
    <div class="body"><div class="verdict">${lines ? `<ul>${lines}</ul>` : ""}</div>${dataHtml || ""}</div></details>`;
}

// ---------- death recaps ----------
const VERDICT = {lived: "Likely lived", close: "Too close to call", died: "Would still die"};

function renderDeathItem(i, showOwner) {
  const chip = (i.verdict ? ` <span class="chip ${i.no_window ? "" : i.verdict}">${VERDICT[i.verdict]}${i.verdict !== "died" && i.lowest != null
    ? ` ~${Math.round(i.lowest * 100)}%` : ""}</span>` : "")
    + (i.no_window ? ` <span class="chip" title="No time to react: not telegraphed and they weren't low for 2s+ - not a mistake">No reaction window</span>` : "")
    + (i.gcd ? ` <span class="chip" title="Costs a global cooldown - holding it is often right">GCD</span>` : "");
  return `<div class="item"><strong>${esc(i.name)}</strong>${showOwner ? ` <span class="sub">(${esc(i.owner)})</span>` : ""}${chip}
    <div class="sub">${T(i.text)}</div></div>`;
}

function renderDeathCol(title, items, showOwner) {
  const known = items.filter((i) => i.status !== "unknown" && !i.escape);
  const unknown = items.filter((i) => i.status === "unknown" && !i.escape);
  return `<div class="col"><h4>${esc(title)}</h4>
    ${known.length ? known.map((i) => renderDeathItem(i, showOwner)).join("") : `<div class="none">Nothing tracked.</div>`}
    ${unknown.length ? `<div class="none" title="Never pressed this run - may not be talented">Not pressed all run: ${unknown.map((i) =>
      esc(i.name) + (i.verdict ? ` (${VERDICT[i.verdict].toLowerCase()})` : "")).join(", ")}</div>` : ""}</div>`;
}

function renderDeaths(res) {
  const deaths = res.deaths || [];
  const k = (v) => v == null ? "" : v >= 1e6 ? `${(v / 1e6).toFixed(1)}M` : `${Math.round(v / 1000)}k`;
  const cards = deaths.map((d) => {
    const t0 = d.t_s != null ? d.t_s : null;
    const rows = d.events.map((e, i) => `<tr class="${i < d.events.length - 8 ? "older" : ""}" ${i < d.events.length - 8 ? "hidden" : ""}>
      <td>${e.dt.toFixed(1)}s</td><td class="${e.kind}">${e.kind === "hit" ? "Hit" : e.kind === "heal" ? "Heal" : "Defensive"}</td>
      <td>${esc(e.ability)}${e.school ? ` <span class="sub">(${e.school})</span>` : ""}</td><td>${esc(e.source || "")}</td>
      <td>${e.kind === "defensive" ? "" : k(e.amount)}${e.overkill ? ` <span class="sub">(${k(e.overkill)} overkill)</span>` : ""}${e.overheal ? ` <span class="sub">(${k(e.overheal)} overheal)</span>` : ""}</td>
      <td>${e.hp == null ? "" : `<span class="hpbar"><i style="width:${Math.round(e.hp * 100)}%"></i></span>${Math.round(e.hp * 100)}%`}</td></tr>`).join("");
    const older = Math.max(0, d.events.length - 8);
    return `<details class="death" data-clock="${esc(d.clock)}" data-victim="${esc(d.victim)}">
      <summary><span class="when">${T(d.clock)}</span><span class="sub">${esc(pullShort(d.pull))}</span>
        <strong>${esc(d.victim)}</strong> ${esc(d.short || `died to ${d.killing}`)}
        ${d.avoid ? `<span class="chip avoid" title="${esc(d.avoid.line)}">${esc(d.avoid.label)}</span>` : ""}
        ${d.stoppable ? `<span class="chip save" title="A cast peer groups usually stop did most of the damage">Stoppable</span>` : ""}
        ${d.fix ? `<span class="fix">→ ${esc(d.fix)}</span>` : ""}</summary>
      <div class="body">
        ${d.story && d.story.advice.length ? `<div class="advice"><strong>What to do:</strong><ul style="margin:4px 0 0;padding-left:18px">
          ${d.story.advice.map((a) => `<li>${T(a)}</li>`).join("")}</ul></div>` : ""}
        ${d.note ? `<div class="story note"><strong>ℹ About ${esc(d.cause ? d.cause.name : d.killing)}:</strong> ${esc(d.note)}</div>` : ""}
        ${d.avoid ? `<div class="story"><strong>⚠ ${esc(d.avoid.label)}:</strong> ${T(d.avoid.line.split(" - ").slice(1).join(" - "))}</div>` : ""}
        ${d.pull_melee ? `<div class="story"><strong>Threat, not healing:</strong> mob melee ${esc(d.pull_melee)} - a DPS the
          pack goes for first is one-shot before any heal lands.</div>` : ""}
        ${d.dodge && d.dodge.why !== d.note ? `<div class="story"><strong>Dodge it:</strong> ${T(d.dodge.why)} - no defensive
          is the answer.</div>` : ""}
        ${(d.after_tank || []).length ? `<div class="story"><strong>Wipe:</strong> after the tank died -
          ${d.after_tank.map((a) => `${esc(a.victim)} (${esc(a.clock)})`).join(", ")}. The pull was lost from here, so these
          deaths aren't analyzed.</div>` : ""}
        ${d.stoppable ? `<div class="story note"><strong>⛔ Could likely have been stopped:</strong> ${esc(d.stoppable.ability)} did
          ${Math.round(d.stoppable.share * 100)}% of the damage, and peer groups stop that cast ${Math.round(d.stoppable.rate * 100)}% of the
          time (${d.stoppable.kickable === false ? "it can't be interrupted - stun or CC only" : "interrupt, stun or CC"}). Ready then: ${d.stoppable.ready.length ? d.stoppable.ready.map((x) =>
            `<b>${x.you ? "you" : esc(x.player)}</b> - ${esc(x.tools.join(", "))}`).join("; ") : "nothing - every interrupt and stun was on cooldown"}.</div>` : ""}
        ${d.cause ? `<div class="story"><strong>Cause:</strong> ${T(d.cause.lines.join(" · "))}
          ${d.cause.name !== d.killing ? ` · killing blow ${esc(d.killing)}` : ""}</div>` : ""}
        ${d.story ? `<ul class="storylines">${d.story.lines.map((l) => `<li>${T(l)}</li>`).join("")}</ul>` : ""}
        ${(d.last_casts || []).filter((x) => x.target).length ? `<div class="story"><strong>Last casts:</strong> ${esc(d.last_casts
          .filter((x) => x.target).map((x) => `${x.ability} → ${x.target}${x.hp != null ? ` @${Math.round(x.hp * 100)}%` : ""} (${x.dt.toFixed(1)}s)`)
          .join(" · "))}</div>` : ""}
        <div class="cols">
          ${renderDeathCol("Group", d.ready.group, true)}
          ${renderDeathCol(d.victim === res.run.player ? `${d.victim} (you, died)` : `${d.victim} (died)`, d.ready.victim, false)}
          ${renderDeathCol(`${res.run.player} (healer)`, d.ready.healer, false)}
        </div>
        <div class="compnote">Last 10s: took ${k(d.taken)}, healed ${k(d.healed)} (max HP ${k(d.max_hp)}).</div>
        <div class="tablewrap"><table class="recap"><tr><th>Before death</th><th></th><th>Ability</th><th>From</th><th>Amount</th><th>HP after</th></tr>
          ${rows}</table></div>
        ${older ? `<button class="jump" onclick="this.closest('.death').querySelectorAll('tr.older').forEach(r=>r.hidden=false); this.remove()">Show all ${d.events.length} events</button>` : ""}
      </div></details>`;
  }).join("");
  return sec("deaths", deaths.length, cards, "Deaths: none.");
}

function openDeath(clock) {
  const el = document.querySelector(`.death[data-clock="${clock}"]`);
  if (!el) return;
  el.open = true;
  el.scrollIntoView({behavior: "smooth", block: "start"});
}

function renderPhases(res) {
  if (!res.phases || !res.phases.length) return "";
  const pct = (v) => v == null ? "-" : `${Math.round(v * 100)}%`;
  const rows = res.phases.map((p) => `<tr><td>${esc(p.pull)}</td><td>${esc(p.phase)}</td><td>${T(p.clock)}</td>
    <td>${p.duration_s}s</td><td class="${p.top_group_hp != null && p.group_hp < p.top_group_hp - 0.05 ? "worse" : ""}">${pct(p.group_hp)}</td>
    <td>${pct(p.top_group_hp)}</td><td>${(p.intake * 100).toFixed(1)}%</td>
    <td>${p.top_intake == null ? "-" : (p.top_intake * 100).toFixed(1) + "%"}</td><td>${p.top_n}</td></tr>`).join("");
  return `<details><summary>Show data</summary><div class="tablewrap"><table>
    <tr><th>Boss</th><th>Phase</th><th>Start</th><th>Length</th><th>Group HP</th><th>Top HP</th>
    <th>Dmg taken / s</th><th>Top dmg / s</th><th>Top runs</th></tr>${rows}</table></div>
    <div class="compnote">Phases come from one-off boss casts that start a new part of the fight in most runs.
    Damage taken = % of group max HP per second.</div></details>`;
}

// ---------- DPS windows: calm stretches a healer can spend on damage ----------
const dpsColor = (w) => w.use == null ? "var(--ink-muted)" : w.use >= 0.75 ? "var(--good)" : w.use >= 0.4 ? "var(--warning)" : "var(--critical)";

function renderDps(res) {
  const d = res.dps, ws = (res.timeline || {}).dps_windows || [];
  if (!d || !ws.length) return "";
  const k = (v) => v == null ? "-" : `${Math.round(v / 1000)}k`, m = (v) => `${(v / 1e6).toFixed(1)}M`;
  const head = `${d.windows} calm window${d.windows === 1 ? "" : "s"} (${d.seconds}s in total)`
    + (d.your_dps ? `: you dealt ${k(d.your_dps)}/s in them` : "")
    + (d.top_dps ? `, peer ${SP.plural} ${k(d.top_dps)}/s in their own calm moments` : "")
    + (d.missed ? ` · ~${m(d.missed)} damage left on the table (your own hit sizes × enemies alive)` : "");
  const worst = ws.filter((w) => w.missed >= 5e4).sort((a, b) => b.missed - a.missed).slice(0, 6).map((w) =>
    `<li><span class="when">${T(w.clock)}</span><span class="pl">${esc(pullShort(w.pull))}</span>
      <span>${w.seconds}s calm · ${w.dps_casts} damage cast${w.dps_casts === 1 ? "" : "s"}, ${w.other_casts} other,
      ~${w.idle_s}s idle</span><b>~${m(w.missed)} missed</b></li>`).join("");
  return `<div class="dpshead">${esc(head)}</div>
    <div class="tlwrap" id="dpsWrap"><svg id="dpsSvg" role="img" aria-label="DPS windows across the run"></svg>
      <div class="tip" id="dpsTip"></div></div>
    <div class="legend-items dpslegend"><span><i class="box" style="background:var(--good)"></i>used like your peers</span>
      <span><i class="box" style="background:var(--warning)"></i>partly used</span>
      <span><i class="box" style="background:var(--critical)"></i>mostly missed</span>
      <span class="hint">A window = 3s+ with the group healthy, nobody low and no big hit coming. Click one to open it on the timeline.</span></div>
    ${worst ? `<h4 class="dpssub">Biggest missed windows</h4><ul class="dpslist">${worst}</ul>` : ""}`;
}

// Whole-run strip of the windows, on the overview's scale (pulls side by side, gaps squeezed).
function drawDps() {
  const svg = $("dpsSvg"), wrap = $("dpsWrap");
  if (!svg || !TL) return;
  const t = TL.res.timeline, ws = t.dps_windows || [];
  const W = Math.max(320, wrap.clientWidth), R = 8, {fs, L} = tlMetrics(W, false), plotW = W - L - R;
  const top = Math.round(fs + 6), h = Math.round(fs * 2), H = top + h + 4;
  const {segs, x} = overviewScale(t, L, plotW);
  let g = "";
  segs.forEach((sg) => {
    g += `<rect x="${sg.x0}" y="${top}" width="${Math.max(1, sg.x1 - sg.x0)}" height="${h}" fill="${sg.p.boss ? "var(--series-7)" : "var(--ink-muted)"}"
      opacity="${sg.p.boss ? .12 : .06}"/>`;
    const label = pullShort(sg.p.label);
    if (sg.x1 - sg.x0 > label.length * fs * 0.58) g += `<text x="${sg.x0 + 3}" y="${top - 4}" ${sg.p.boss ? 'style="font-weight:700"' : ""}>${esc(label)}</text>`;
  });
  ws.forEach((w, i) => {
    const xa = x(w.start_s), xb = x(w.end_s);
    g += `<rect x="${xa}" y="${top + 3}" width="${Math.max(4, xb - xa)}" height="${h - 6}" rx="2" fill="${dpsColor(w)}" opacity=".8"
      data-w="${i}" style="cursor:pointer"/>`;
  });
  g += `<text class="lane" x="8" y="${top + h / 2 + fs * 0.35}">Whole run</text>`;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("height", H);
  svg.innerHTML = g;
  const tip = $("dpsTip");
  svg.onmousemove = (ev) => {
    const el = ev.target.closest("[data-w]");
    if (!el) { tip.style.display = "none"; return; }
    const w = ws[+el.dataset.w], lines = w.tip.filter(Boolean);
    tip.innerHTML = `<b>${esc(w.clock)} · ${esc(pullShort(w.pull))}</b>${lines.map((l) => `<br>${esc(l)}`).join("")}`;
    tip.style.display = "block";
    const r = svg.getBoundingClientRect(), px = ev.clientX - r.left;
    tip.style.left = `${Math.max(0, Math.min(px + 12, wrap.clientWidth - tip.offsetWidth - 4))}px`;
    tip.style.top = `${top + h}px`;
  };
  svg.onmouseleave = () => { tip.style.display = "none"; };
  svg.onclick = (ev) => {
    const el = ev.target.closest("[data-w]");
    if (el) { const w = ws[+el.dataset.w]; focusTimeline(w.start_s, w.end_s); }
  };
}

function renderSpells(res) {
  const sc = res.spell_choice;
  if (!sc || !sc.you) return "";
  const G = esc(SP.group), S = esc(SP.single);  // table keys: ch_* = group heal, hw_* = single-target heal
  const pct = (v) => v == null ? "-" : `${Math.round(v * 100)}%`;
  const k = (v) => v == null ? "-" : `${Math.round(v / 1000)}k`;
  const label = {none: "Nobody injured", one: "1 player injured", two: "2 players injured", group: "3+ players injured"};
  const rows = ["none", "one", "two", "group"].map((s) => {
    const y = sc.you[s], t = (sc.top || {})[s] || {};
    return `<tr><td>${label[s]}</td><td>${y.casts}</td><td>${pct(y.ch_share)}</td><td>${pct(t.ch_share)}</td>
      <td>${pct(y.ch_overheal)} / ${pct(t.ch_overheal)}</td><td>${pct(y.hw_overheal)} / ${pct(t.hw_overheal)}</td>
      <td>${k(y.ch_effective)} / ${k(y.hw_effective)}</td><td>${pct(y.mana)}</td></tr>`;
  }).join("");
  const bt = sc.buffs || {};
  const buffRows = Object.entries(bt.you || {}).filter(([, y]) => y.casts).map(([name, y]) => {
    const t = (bt.top || {})[name] || {};
    return `<tr><td>${esc(name)}</td><td>${y.casts}</td><td>${pct(y.ch_share)}</td><td>${pct(t.ch_share)}</td>
      <td>${k(y.ch_effective)} / ${k(y.hw_effective)}</td><td>${k(t.ch_effective)} / ${k(t.hw_effective)}</td></tr>`;
  }).join("");
  return `<details><summary>Show data</summary><div class="tablewrap"><table>
    <tr><th>Situation at cast</th><th>Your heals</th><th>Your ${G} share</th><th>Top ${G} share</th>
    <th>${G} overheal (you / top)</th><th>${S} overheal (you / top)</th><th>Your healing per cast (${G} / ${S})</th><th>Your mana</th></tr>
    ${rows}</table></div>
    ${buffRows ? `<div class="tablewrap" style="margin-top:12px"><table>
    <tr><th>Buff up at cast</th><th>Your heals</th><th>Your ${G} share</th><th>Top ${G} share</th>
    <th>Your per cast (${G} / ${S})</th><th>Top per cast (${G} / ${S})</th></tr>${buffRows}</table></div>` : ""}
    <div class="compnote">"Injured" = below 80% HP just before the heal landed. Healing per cast counts every target hit.</div></details>`;
}

function renderFinding(f, i, res) {
  return `<details class="finding ${sevClass(f.severity)}" data-i="${i}" data-t="${f.pull !== "Whole run" ? f.t_s : ""}">
    <summary><span class="when">${f.pull !== "Whole run" ? T(f.clock) : "run"}</span>
      <span class="pl">${esc(pullShort(f.pull))}</span>
      <span class="title">${esc(f.short || f.title)}</span>
      ${f.fix ? `<span class="fix">→ ${esc(f.fix)}</span>` : ""}
      <span class="sev ${sevClass(f.severity)}" title="Impact score ${f.severity}">${sevLabel(f.severity)}</span></summary>
    <div class="body">
      <div class="pull">${esc(f.title)} · ${esc(f.pull)}${f.rule === "death" && (res.deaths || []).some((d) => d.clock === f.clock)
        ? ` · <button class="jump" onclick="openDeath('${esc(f.clock)}')">Death recap</button>` : ""}</div>
