    <th>${G} overheal (you / top)</th><th>${S} overheal (you / top)</th><th>Your healing per cast (${G} / ${S})</th><th>Your mana</th></tr>
    ${rows}</table></div>
    ${buffRows ? `<div class="tablewrap" style="margin-top:12px"><table>
    <tr><th>Buff up at cast</th><th>Your heals</th><th>Your ${G} share</th><th>Top ${G} share</th>
    <th>Your per cast (${G} / ${S})</th><th>Top per cast (${G} / ${S})</th></tr>${buffRows}</table></div>` : ""}
    <div class="compnote">"Injured" = below 80% HP just before the heal landed. Healing per cast counts every target hit.</div></details>`;
}

function renderFinding(f, i, res) {
  return `<details class="finding ${sevClass(f.severity)}" data-i="${i}" data-t="${f.pull !== "Whole run" ? f.t_s : ""}">
    <summary><span class="when">${f.pull !== "Whole run" ? T(f.clock) : "run"}</span>
      <span class="pl">${esc(pullShort(f.pull))}</span>
      <span class="title">${esc(f.short || f.title)}</span>
      ${f.fix ? `<span class="fix">→ ${esc(f.fix)}</span>` : ""}
      <span class="sev ${sevClass(f.severity)}" title="Impact score ${f.severity}">${sevLabel(f.severity)}</span></summary>
    <div class="body">
      <div class="pull">${esc(f.title)} · ${esc(f.pull)}${f.rule === "death" && (res.deaths || []).some((d) => d.clock === f.clock)
        ? ` · <button class="jump" onclick="openDeath('${esc(f.clock)}')">Death recap</button>` : ""}</div>
      ${f.context && f.context.length ? `<dl class="ctx">${f.context.map(([k, v]) =>
        `<dt>${esc(k)}</dt><dd>${T(v)}</dd>`).join("")}</dl>` : ""}
      ${f.detail.length ? `<ul>${f.detail.map((d) => `<li>${T(d)}</li>`).join("")}</ul>` : ""}
    </div></details>`;
}

// The analyzed healer's spec: names used in labels (results saved before specs existed are Resto Shaman).
let SP = {};
function render(res, url) {
  SP = res.spec || {label: "Resto Shaman", plural: "Resto Shamans", single: "Healing Wave", group: "Chain Heal",
                    maintenance: "Riptides", majors: "Healing Tide or Spirit Link"};
  SECTIONS.spells.title = SP.single && SP.group ? `${SP.single} vs ${SP.group}` : "Single-target vs group heal";
  const r = res.run, c = res.compared, v = res.verdicts || {};
  const levels = c.levels.map((l) => `+${l}`).join(", ") || "none";
  const good = res.good_calls.map((g) => `
      <div class="good"><span class="check">✓</span><span>${T(g.title)} · ${esc(pullShort(g.pull))}
      <span style="color:var(--muted)"> - ${T(g.detail.join(" "))}</span></span></div>`).join("");
  const kk = (x) => x == null ? "-" : `${Math.round(x / 1000)}k`;
  const pp = (x) => x == null ? "-" : `${Math.round(x * 100)}%`;
  const rows = res.requirements.map((q) => `<tr><td>${esc(q.pull)}</td><td>${Math.round(q.duration_s)}s</td>
      <td class="${q.top_group_hp != null && q.group_hp < q.top_group_hp - 0.03 ? "worse" : ""}">${pp(q.group_hp)}</td><td>${pp(q.top_group_hp)}</td>
      <td>${kk(q.intake)}</td><td>${kk(q.top_intake)}</td><td>${kk(q.healing)}</td><td>${kk(q.top_healing)}</td></tr>`).join("");
  const todo = (x) => x && x.lines ? x.lines.filter((l) => l.action).length : 0;
  const counts = {look: res.findings.length, deaths: (res.deaths || []).length, phases: todo(v.phases),
                  items: todo(v.items), spells: todo(v.spells), pulls: todo(v.pulls), good: res.good_calls.length};

  $("main").innerHTML = `
    <div class="card">
    <div class="runhead"><h3>${esc(r.dungeon)} +${r.level}</h3>
      <span class="tag ${r.timed ? "timed" : "depleted"}">${r.timed ? "Timed" : "Not timed"}</span>
      <div class="actions"><a class="link" href="${esc(url)}" target="_blank" rel="noopener">Open log</a>
      <button class="link" id="fresh">Re-analyze</button></div></div>
    <div class="meta">${esc(r.player)} (${esc(SP.label)}) · ${r.duration_min} min · ${r.deaths} death${r.deaths === 1 ? "" : "s"} ·
      compared with ${c.count} top ${esc(SP.label)} logs (${levels})${(c.skipped || []).length
        ? ` <span title="${esc(c.skipped.map((s) => `${s.player} +${s.key}: ${s.reasons.join(", ")}`).join("\n"))}">(${c.skipped.length} skipped: incomplete data)</span>`
        : ""}${c.model ? ` · context from top runs ${esc(c.model)}` : ""}</div>
    ${renderGroup(res)}</div>
    ${renderTimelineShell(res)}
    ${nav(counts)}
    ${sec("look", res.findings.length, `<div class="lookbar" id="lookBar" hidden></div>`
          + res.findings.map((f, i) => renderFinding(f, i, res)).join(""),
          "Nothing worth flagging - this run holds up against top players.")}
    ${renderDeaths(res)}
    ${sec("phases", res.phases && res.phases.length ? counts.phases || "ok" : 0, verdictBlock(v.phases, renderPhases(res)),
          "Boss phases: none detected on this run.", false)}
    ${sec("items", (res.items || []).length ? counts.items || "ok" : 0, verdictBlock(v.items, renderItems(res)),
          "Trinkets & consumables: none used.", false)}
    ${sec("spells", res.spell_choice && res.spell_choice.you ? counts.spells || "ok" : 0, verdictBlock(v.spells, renderSpells(res)),
          "Not enough heals to judge.", false)}
    ${sec("pulls", rows ? counts.pulls || "ok" : 0, verdictBlock(v.pulls, `<details><summary>Show data</summary><div class="tablewrap"><table>
      <tr><th>Pull</th><th>Time</th><th>Group HP</th><th>Top HP</th><th>Dmg in/s</th><th>Top in/s</th><th>Heal/s</th><th>Top heal/s</th></tr>
      ${rows}</table></div></details>`), "No pulls to compare.", false)}
    ${sec("good", res.good_calls.length, `<details class="vsec ok"><summary>✓ ${res.good_calls.length} cooldowns pressed at the right moment</summary>
      <div class="body">${good}</div></details>`, "Good calls: none recorded.", false)}
    ${renderCompareShell()}
    <div class="caveat">Everything here is read from combat logs, not the encounter journal - if a mechanic has a side
      effect the log can't show (e.g. dispelling something is punished), the advice changes. Defensive values in
      data/defensives.json are approximate.</div>`;
  $("fresh").onclick = () => analyze(url, true);
  initTimeline(res);
  initCompare(url);
}

// ---------- "What to look at" for the selected pull ----------
// null = whole dungeon. Set when a pull is picked (dropdown / overview click), not by time links.
function filterLook(i) {
  const pulls = TL ? TL.res.timeline.pulls : [], p = i == null ? null : pulls[i];
  const all = document.querySelectorAll("#sec-look .finding");
  let n = 0;
  all.forEach((el) => {
    const t = el.dataset.t === "" ? NaN : +el.dataset.t;
    const on = !p || (t >= p.start_s - 1 && t <= p.end_s + 1);
    el.hidden = !on;
    if (on) n++;
  });
  const bar = $("lookBar"), badge = document.querySelector("#sec-look .badge");
  if (badge) badge.textContent = p ? `${n} / ${all.length}` : all.length;
  if (!bar) return;
  bar.hidden = !p;
  if (p) bar.innerHTML = `<span>${n ? `Showing ${n} of ${all.length} for` : "Nothing flagged in"} <b>${esc(p.label)}</b>
    (${fmtClock(p.start_s)}-${fmtClock(p.end_s)})</span><button class="tlbtn" onclick="filterLook(null)">Show full dungeon</button>`;
}

function openChar() { $("charError").textContent = ""; $("charDialog").showModal(); }
$("charBtn").onclick = openChar;
$("charForm").addEventListener("submit", async (e) => {
  if (e.submitter && e.submitter.value === "cancel") return;
  e.preventDefault();
  $("charSave").disabled = true;
  try {
    await api("/api/settings", {method: "POST", body: JSON.stringify(
      {name: $("cName").value.trim(), server: $("cServer").value.trim(), region: $("cRegion").value})});
    $("charDialog").close();
    $("runs").innerHTML = `<div class="empty">Loading...</div>`;
    loadRuns();
  } catch (err) { $("charError").textContent = err.message; }
  $("charSave").disabled = false;
});
$("pasteForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const url = $("pasteUrl").value.trim();
  if (url) analyze(url);
});

// ---------- top-player study ----------
let studyTimer = null;
async function loadStudy() {
  try {
    const s = await api("/api/study");
    const job = s.job || {};
    if (job.status === "running") {
      $("studyBtn").textContent = `Study running: ${(job.progress || []).slice(-1)[0] || "starting..."}`;
      clearTimeout(studyTimer); studyTimer = setTimeout(loadStudy, 5000);
      return;
    }
    if (job.status === "error") { $("studyBtn").textContent = "Study failed - click to retry"; $("studyBtn").title = job.error; return; }
    if (!s.exists) { $("studyBtn").textContent = "No top-player study - click to run"; return; }
    const days = s.generated ? Math.floor((Date.now() - new Date(s.generated)) / 86400000) : null;
    const counts = Object.values(s.runs || {});
    $("studyBtn").textContent = `Study: ${days == null ? "age unknown" : days === 0 ? "today" : days + "d old"}`
      + (counts.length ? ` · ${Math.min(...counts)}-${Math.max(...counts)} runs/dungeon` : "");
    $("studyBtn").classList.toggle("stale", days == null || days >= 7);
  } catch { $("studyBtn").textContent = "Top-player study"; }
}
$("studyBtn").onclick = async () => {
  const s = await api("/api/study").catch(() => ({}));
  if (s.job && s.job.status === "running") { alert((s.job.progress || []).join("\n") || "Running..."); return; }
  if (!confirm("Refresh the top-player study (10 top runs per dungeon)?\n\nIt pauses whenever the hourly WCL budget gets low, "
    + "so it can take a few hours. You can keep analyzing keys meanwhile; closing the app stops it (cached runs are kept).")) return;
  try { await api("/api/study", {method: "POST", body: JSON.stringify({runs: 10})}); } catch (e) { alert(e.message); }
  loadStudy();
};

// Text size: Normal (15px root) / Large (17px); everything is in rem, the timeline re-measures.
function setTextSize(large) {
  document.documentElement.classList.toggle("large", large);
  $("textSize").textContent = `Text: ${large ? "Large" : "Normal"}`;
  $("textSize").classList.toggle("on", large);
  lsSet("textSize", large ? "large" : "normal");
  if (TL && $("tlSvg")) { drawTimeline(); updatePinHeight(); }
}
$("textSize").onclick = () => setTextSize(!document.documentElement.classList.contains("large"));
setTextSize(lsGet("textSize") === "large");
loadRuns();
loadBudget();
loadStudy();
// Links: ?run=<log url> opens that run (&at=<element id> scrolls to it, &pull=<n|whole> picks the timeline view);
// ?theme=dark|light overrides the system theme.
(async () => {
  const q = new URLSearchParams(location.search);
  if (["dark", "light"].includes(q.get("theme"))) document.documentElement.dataset.theme = q.get("theme");
  if (!q.get("run")) return;
  await analyze(q.get("run"));
  if (TL && q.get("pull")) selectPull(q.get("pull") === "whole" ? -1 : +q.get("pull") - 1);
  if (q.get("at") && $(q.get("at"))) $(q.get("at")).scrollIntoView({block: "start"});
  if (q.get("open") && $(q.get("open"))) $(q.get("open")).open = true;  // e.g. &open=tlLanes
})();
</script>
