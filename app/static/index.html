      ${f.context && f.context.length ? `<dl class="ctx">${f.context.map(([k, v]) =>
        `<dt>${esc(k)}</dt><dd>${T(v)}</dd>`).join("")}</dl>` : ""}
      ${f.detail.length ? `<ul>${f.detail.map((d) => `<li>${T(d)}</li>`).join("")}</ul>` : ""}
    </div></details>`;
}

// The analyzed healer's spec: names used in labels (results saved before specs existed are Resto Shaman).
let SP = {};
function render(res, url) {
  SP = res.spec || {label: "Resto Shaman", plural: "Resto Shamans", single: "Healing Wave", group: "Chain Heal",
                    maintenance: "Riptides", majors: "Healing Tide or Spirit Link"};
  SECTIONS.spells.title = SP.single && SP.group ? `${SP.single} vs ${SP.group}` : "Single-target vs group heal";
  const r = res.run, c = res.compared, v = res.verdicts || {};
  const levels = c.levels.map((l) => `+${l}`).join(", ") || "none";
  const good = res.good_calls.map((g) => `
      <div class="good"><span class="check">✓</span><span>${T(g.title)} · ${esc(pullShort(g.pull))}
      <span style="color:var(--muted)"> - ${T(g.detail.join(" "))}</span></span></div>`).join("");
  const kk = (x) => x == null ? "-" : `${Math.round(x / 1000)}k`;
  const pp = (x) => x == null ? "-" : `${Math.round(x * 100)}%`;
  const rows = res.requirements.map((q) => `<tr><td>${esc(q.pull)}</td><td>${Math.round(q.duration_s)}s</td>
      <td class="${q.top_group_hp != null && q.group_hp < q.top_group_hp - 0.03 ? "worse" : ""}">${pp(q.group_hp)}</td><td>${pp(q.top_group_hp)}</td>

// ---------- review strictness: farm keys get only what hurt, push keys the full review ----------
const OUTCOME_RULES = ["death", "self_danger"];  // deaths and near-deaths always show
const NITPICK_RULES = ["riptide_prep", "spell_choice", "buff_choice", "planned_cooldown"];
const STUDY_RULES = ["planned_cooldown", "riptide_prep", "cooldown_rate"];  // timings learned from top players
function reviewTier(res) {
  const pick = lsGet("strict") || "auto", level = res.run.level, best = res._best;
  const tiers = {farm: "Farm key - showing only what hurt", normal: "Normal key - what hurt and clear patterns",
                 push: "Push key - full review"};
  let key = {relaxed: "farm", normal: "normal", strict: "push"}[pick], why = "set in Display";
  if (!key) {
    const gap = best == null ? 0 : best - level;
    key = gap >= 5 ? "farm" : gap >= 2 ? "normal" : "push";
    why = best == null ? "your best key isn't known" : `your best timed key is +${best}`;
  }
  return {key, line: `${tiers[key]} (${why}).`, minorWhy: key === "farm" ? "farm key" : key === "normal" ? "below your push range" : "top players' timings are from higher keys"};
}
// [[finding, index]] shown / folded away. Timings learned from top players only count near the study's key range.
function splitFindings(res, tier) {
  const studyMin = Math.min(...((res.compared || {}).model || "").split(",").map((x) => parseInt(x.replace("+", ""))).filter((n) => n > 0));
  const shown = [], minor = [];
  res.findings.forEach((f, i) => {
    const outcome = OUTCOME_RULES.includes(f.rule) || f.severity >= 70;
    const farFromStudy = STUDY_RULES.includes(f.rule) && isFinite(studyMin) && res.run.level < studyMin - 2;
    const keep = !farFromStudy && (tier.key === "push" || outcome
      || (tier.key === "normal" && f.severity >= 45 && !NITPICK_RULES.includes(f.rule)));
    (keep ? shown : minor).push([f, i]);
  });
  return {shown, minor};
}
function setStrict(pick, rerender = true) {
  lsSet("strict", pick);
  document.querySelectorAll("[data-strict-pick]").forEach((b) => b.classList.toggle("on", b.dataset.strictPick === pick));
  if (rerender && TL && TL.res && !TL.res.preview) render(TL.res, TL.url);

// Ability names in the text -> Wowhead tooltip links (hover only; Ctrl/Cmd-click opens Wowhead).
function linkSpells(root, ids) {
  const names = Object.keys(ids).sort((a, b) => b.length - a.length);
  if (!root || !names.length) return;
  const re = new RegExp(`(?<![\\w'])(${names.map((n) => n.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|")})(?![\\w'])`, "g");
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode: (n) =>
    n.parentElement.closest("a, button, svg, script, style, .spell, input, select, textarea, .tlwrap")
      ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT});
  const nodes = [];
  const has = new RegExp(re.source);  // non-global: .test() keeps no position between nodes
  while (walker.nextNode()) if (has.test(walker.currentNode.nodeValue)) nodes.push(walker.currentNode);
  nodes.forEach((node) => {
    const frag = document.createDocumentFragment();
    let last = 0;
    node.nodeValue.replace(re, (m, name, at) => {
      frag.append(node.nodeValue.slice(last, at));
      const a = document.createElement("a");
      a.className = "spell"; a.textContent = m; a.target = "_blank"; a.rel = "noopener";
      a.href = `https://www.wowhead.com/spell=${ids[name]}`;
      frag.append(a);
      last = at + m.length;
    });
    frag.append(node.nodeValue.slice(last));
    node.replaceWith(frag);
  });
  try { if (window.$WowheadPower) $WowheadPower.refreshLinks(); } catch {}
}
document.addEventListener("click", (e) => {  // inside a finding's summary a name shouldn't navigate or fold it

// sees when it was refreshed and which specs it covers.
$("studyBtn").onclick = async () => {
  const s = await api(`/api/study${SP.key ? `?spec=${SP.key}` : ""}`).catch(() => ({}));
  const ago = (iso) => { if (!iso) return "never"; const d = Math.floor((Date.now() - new Date(iso)) / 86400000);
    return d === 0 ? "today" : d === 1 ? "yesterday" : `${d} days ago`; };
  const covered = (s.covered || []).map((c) => `${esc(c.label)} (${ago(c.generated)})`).join(", ") || "none yet";
  const running = s.job && s.job.status === "running";
  $("studyBody").innerHTML = `<p class="secempty">The top-player study is the season's top-ranked runs per dungeon
      (timings, habits and the Top players band). ${s.can_run ? "" : "It's refreshed by the site admin."}</p>
    <p><b>Specs covered:</b> ${covered}</p>
    ${running ? `<div class="progress">${(s.job.progress || []).slice(-6).map((x) => `<div>${esc(x)}</div>`).join("")}</div>` : ""}
    ${s.can_run && !running ? `<label for="studySpec">Spec</label><select id="studySpec">${(s.specs || []).map((sp) =>
        `<option value="${sp.key}" ${sp.key === (SP.key || "resto_shaman") ? "selected" : ""}>${esc(sp.label)}</option>`).join("")}</select>
      <label for="studyRuns">Top runs per dungeon</label><input id="studyRuns" type="number" min="3" max="20" value="5">
      <p class="secempty">It pauses for the hourly Warcraft Logs reset when the budget runs low (keeping some for
        everyone's analyses), so it can take hours. Cached runs make a rerun cheap.</p>
      <div class="row"><button type="button" class="pill" id="studyExport">Export file</button>
        <button type="button" class="primary" id="studyStart">Start study</button></div>` : ""}`;
  $("studyDialog").showModal();
  if ($("studyStart")) $("studyStart").onclick = async () => {
    try {
      await api("/api/study", {method: "POST", body: JSON.stringify({spec: $("studySpec").value, runs: +$("studyRuns").value || 5})});
      $("studyDialog").close(); loadStudy();
    } catch (e) { reportError("study", "Starting the top-player study", e.message, null, e.ref); $("studyDialog").close(); }
  };
  if ($("studyExport")) $("studyExport").onclick = () => { location.href = `/api/study/export?spec=${$("studySpec").value}`; };
};

// Text size: Normal (15px root) / Large (17px); everything is in rem, the timeline re-measures.
function setTextSize(large) {
  document.documentElement.classList.toggle("large", large);
  document.querySelectorAll("[data-size-pick]").forEach((b) => b.classList.toggle("on", (b.dataset.sizePick === "large") === large));
  lsSet("textSize", large ? "large" : "normal");
  if (TL && $("tlSvg")) { drawTimeline(); updatePinHeight(); }
}
document.querySelectorAll("[data-size-pick]").forEach((b) => b.onclick = () => setTextSize(b.dataset.sizePick === "large"));
setTextSize(lsGet("textSize") === "large");
// The Display menu (theme + text size) opens from the icon at the header's edge; a click elsewhere closes it.
$("dispBtn").onclick = (e) => {
  e.stopPropagation();
  $("dispMenu").hidden = !$("dispMenu").hidden;
  $("dispBtn").setAttribute("aria-expanded", String(!$("dispMenu").hidden));
};
document.addEventListener("click", (e) => {
  if (!$("dispMenu").hidden && !e.target.closest(".display")) { $("dispMenu").hidden = true; $("dispBtn").setAttribute("aria-expanded", "false"); }
});

// Hosted mode: sign in with Warcraft Logs first; your analyses then run on your own account.
async function startApp() {
  const me = await api("/api/me").catch(() => ({mode: "local"}));
  if (me.mode === "wcl" && !me.user) {
    ["studyBtn", "charBtn", "budget"].forEach((id) => { $(id).hidden = true; });
    // Signed out with a link to a run: a saved analysis of a public run opens without signing in.
    const run = new URLSearchParams(location.search).get("run");
    const saved = run ? await api(`/api/public-analysis?url=${encodeURIComponent(run)}`).catch(() => null) : null;
    if (saved) {
      document.querySelector(".layout > aside").hidden = true;
      document.querySelector(".layout").style.gridTemplateColumns = "minmax(0, 1fr)";
      const signin = document.createElement("a");
      signin.className = "primary"; signin.href = "/login"; signin.textContent = "Sign in to analyze your runs";
      $("charBtn").closest(".charpick").after(signin);
      render(saved.result, run);
      if ($("fresh")) $("fresh").hidden = true;  // re-analyzing needs a sign-in
      setUpdateNote("Viewing a saved analysis of a public run. Sign in to analyze new runs or your private logs.");
      return false;
    }
    document.querySelector(".layout").innerHTML = `<main class="card signin">
      <h2>Healer Review</h2>
      <p>Context-aware Mythic+ healing review, compared with top players of your spec at your key level.</p>
      <p>Sign in with your Warcraft Logs account: your analyses run on your own account and API limit, and your
        private logs stay visible only to you.</p>
      <a class="primary" href="/login">Sign in with Warcraft Logs</a>
      <p class="secempty">If Warcraft Logs asks you to log in first, it may leave you on its home page afterwards -
        come back here and click Sign in again; it goes straight through then.</p></main>`;
    const q = new URLSearchParams(location.search);
    if (q.get("signin") === "failed") {
      signinError(q.get("reason"));
      history.replaceState(null, "", "/");  // a reload shouldn't report it again
    }
    return false;
  }
  if (me.user) {
    const out = document.createElement("button");
    out.className = "pill"; out.textContent = `${me.user} · Sign out`;
    out.title = `Your Warcraft Logs user id: ${me.user_id}`;  // what goes in ADMIN_USER_IDS
    if (me.admin) {
      const adm = document.createElement("span");
      adm.className = "tag prep"; adm.textContent = "Admin"; adm.title = `Site admin (Warcraft Logs user id ${me.user_id})`;
      $("charBtn").closest(".charpick").after(adm);
    }
    out.onclick = async () => { await fetch("/logout", {method: "POST"}); location.href = "/"; };
    $("charBtn").closest(".charpick").after(out);
  }
  return true;
}
const appReady = startApp();
appReady.then((ok) => { if (ok) { loadRuns(); loadBudget(); loadStudy(); } });
// Links: ?run=<log url> opens that run (&at=<element id> scrolls to it, &pull=<n|whole> picks the timeline view);
// Theme: dark by default; the header toggle remembers light. ?theme=dark|light overrides for this page.
// Theme: follows the OS (prefers-color-scheme), dark when it says nothing; the Display menu overrides and is remembered.
// ?theme=dark|light overrides for this page only.
const OS_LIGHT = matchMedia("(prefers-color-scheme: light)");
function setTheme(pick, save = true) {
  document.documentElement.dataset.theme = pick === "system" ? (OS_LIGHT.matches ? "light" : "dark") : pick;
  document.querySelectorAll("[data-theme-pick]").forEach((b) => b.classList.toggle("on", b.dataset.themePick === pick));
  if (save) lsSet("theme", pick);
  if (TL && $("tlSvg")) { drawTimeline(); drawDps(); }
}
const themePick = () => ["dark", "light"].includes(lsGet("theme")) ? lsGet("theme") : "system";
document.querySelectorAll("[data-theme-pick]").forEach((b) => b.onclick = () => setTheme(b.dataset.themePick));
OS_LIGHT.addEventListener("change", () => { if (themePick() === "system") setTheme("system", false); });
setTheme(themePick(), false);
paintIcons();
(async () => {
  const q = new URLSearchParams(location.search);
  if (["dark", "light"].includes(q.get("theme"))) setTheme(q.get("theme"), false);
  if (!q.get("run") || !(await appReady)) return;
  await analyze(q.get("run"));
  if (TL && PRESETS[q.get("preset")]) { applyPreset(q.get("preset")); syncToggles(); drawTimeline(); }
  if (TL && q.get("pull")) selectPull(q.get("pull") === "whole" ? -1 : +q.get("pull") - 1);
  if (TL && ["peers", "top"].includes(q.get("base"))) setBase(q.get("base"));  // &base=top: open on that baseline
  const zoom = (q.get("view") || "").match(/^(\d+)-(\d+)$/);  // &view=<from s>-<to s>: open zoomed to that range
  if (TL && zoom && +zoom[2] > +zoom[1]) { TL.view = [+zoom[1], +zoom[2]]; drawTimeline(); }
  if (q.get("at") && $(q.get("at"))) $(q.get("at")).scrollIntoView({block: "start"});
  const toOpen = q.get("open") && $(q.get("open"));  // e.g. &open=tlLanes (a menu) or &open=dispBtn (a button)
  if (toOpen) { if (toOpen.tagName === "DETAILS") toOpen.open = true; else toOpen.click(); }
})();
</script>
</body>
