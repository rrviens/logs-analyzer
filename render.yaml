# Render blueprint (https://render.com/docs/blueprint-spec). Secrets are entered in the Render dashboard
# (sync: false), never committed. One instance with a persistent disk for the cache, sessions and settings.
services:
  - type: web
    name: healer-review
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    numInstances: 1
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: AUTH_MODE
        value: wcl
      - key: DATA_DIR
        value: /data
      - key: TOP_WORKERS
        value: "2"  # top logs fetched at once; events stream page by page since the 502 fix. Back to "1" on memory errors
      - key: FETCH_STREAMS
        value: "3"  # event streams of one log fetched at once (each trims page by page); lower to 2 on memory errors
      - key: WCL_CLIENT_ID
        sync: false
      - key: WCL_CLIENT_SECRET
        sync: false
      - key: REDIRECT_URI
        sync: false  # https://<your-service>.onrender.com/callback - also add it in your WCL API client
